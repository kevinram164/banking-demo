# OpenTelemetry cho banking trên dev-k8s
# App → OTEL Collector (ns observability, repo cloud-native-platform) → Coroot
#
# Lab: tắt uvicorn GET /health,/metrics log (SILENCE_PROBE_ACCESS_LOGS).
# OTEL heartbeat 60p; transfer log one-liner.

global:
  observability:
    otelEndpoint: "http://opentelemetry-collector.observability.svc.cluster.local:4317"
    otelProtocol: "grpc"

api-producer:
  extraEnv:
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://opentelemetry-collector.observability.svc.cluster.local:4317"
    OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
    OTEL_SERVICE_NAME: "api-producer"
    OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=dev-k8s,k8s.namespace.name=npd-banking,k8s.cluster.name=npd-k8s"
    OTEL_HEARTBEAT: "1"
    OTEL_HEARTBEAT_SECONDS: "3600"
    LOG_REQUEST_FLOW: "false"
    SILENCE_PROBE_ACCESS_LOGS: "true"
    UVICORN_ACCESS_LOG: "off"
    RABBITMQ_RESPONSE_TIMEOUT: "20"

