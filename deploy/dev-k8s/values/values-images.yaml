# Image tags — CI (Jenkins GitOpsUpdater) cập nhật trên nhánh dev-k8s
# Registry: npd-harbor.co (robot pull → Secret harbor-pull-creds, tạo bằng script platform từ Vault)
# IMPORTANT: luôn quote tag (SHA kiểu 82489e3 bị YAML parse thành float 8.2489e+07)

global:
  imageRegistry: npd-harbor.co/banking-demo

# Helm chart đọc imagePullSecrets theo từng service (không dùng global)
x-harbor-pull: &harborPullSecrets
  - name: harbor-pull-creds

api-producer:
  imagePullSecrets: *harborPullSecrets
  image:
    repository: npd-harbor.co/banking-demo/api-producer
    tag: 9b04db8
    pullPolicy: Always

auth-service:
  imagePullSecrets: *harborPullSecrets
  image:
    repository: npd-harbor.co/banking-demo/auth-service
    tag: 9b04db8
    pullPolicy: Always

account-service:
  imagePullSecrets: *harborPullSecrets
  image:
    repository: npd-harbor.co/banking-demo/account-service
    tag: 9b04db8
    pullPolicy: Always

transfer-service:
  imagePullSecrets: *harborPullSecrets
  image:
    repository: npd-harbor.co/banking-demo/transfer-service
    tag: 2579a2f
    pullPolicy: Always

notification-service:
  imagePullSecrets: *harborPullSecrets
  image:
    repository: npd-harbor.co/banking-demo/notification-service
    tag: 9b04db8
    pullPolicy: Always

shop-bridge:
  imagePullSecrets: *harborPullSecrets
  image:
    repository: npd-harbor.co/banking-demo/shop-bridge
    tag: b1a30c0
    pullPolicy: Always

frontend:
  imagePullSecrets: *harborPullSecrets
  image:
    repository: npd-harbor.co/banking-demo/frontend
    tag: 0398c1f
    pullPolicy: Always

# Blue-Green FE v2 — Jenkins BUILD_TARGET=frontend-green (folder frontend-green/)
frontend-green:
  imagePullSecrets: *harborPullSecrets
  image:
    repository: npd-harbor.co/banking-demo/frontend-green
    tag: 0398c1f
    pullPolicy: Always
