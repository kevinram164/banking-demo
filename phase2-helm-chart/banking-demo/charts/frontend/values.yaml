# ArgoCD/Helm merge theo key frontend
frontend:
  fullnameOverride: frontend
  enabled: true
  image:
    repository: registry.gitlab.com/kiettt164/banking-demo-payment/frontend
    tag: 2d4c7af
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  replicas: 1
  # Blue-Green (Đợt H-FE): dual Deploy + frontend-edge + VIP Service frontend
  # Bật qua gitops/values-frontend-bluegreen.yaml — xem mesh/BLUE-GREEN-BANKING-FRONTEND.md
  blueGreen:
    enabled: false
    replicas: 1
    # Edge sticky split (khi enabled) — đồng bộ với HTTPRoute weights
    weight:
      blue: 100
      green: 0
    blue:
      image:
        tag: "" # default = frontend.image.tag (repo = frontend.image.repository)
    green:
      # Code: banking-demo/frontend-green/ — image Harbor riêng, không dùng UI_VARIANT
      image:
        repository: "" # default = <frontend.repository>-green
        tag: "" # default = frontend.image.tag
    edge:
      replicas: 1
      # Tái dùng image frontend (chỉ mount nginx conf proxy) — không cần image riêng
      image:
        repository: ""
        tag: ""
      resources:
        requests:
          memory: "32Mi"
          cpu: "25m"
        limits:
          memory: "64Mi"
          cpu: "100m"
  service:
    port: 80
    # Container listen 8080 (non-root OCP); Service :80 → pod :8080
    targetPort: 8080
    portName: http
  readinessProbe:
    enabled: true
    path: /
    port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 1
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"
  securityContext:
    pod:
      seccompProfile:
        type: RuntimeDefault
    container:
      allowPrivilegeEscalation: false
      # OCP arbitrary UID; image đã chmod g+rwX group 0
      runAsNonRoot: true
