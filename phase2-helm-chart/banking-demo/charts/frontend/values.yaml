# ArgoCD/Helm merge theo key frontend
frontend:
  fullnameOverride: frontend
  enabled: true
  image:
    repository: registry.gitlab.com/kiettt164/banking-demo-payment/frontend
    tag: 2d4c7af
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  replicas: 1
  service:
    port: 80
    # Container listen 8080 (non-root OCP); Service :80 → pod :8080
    targetPort: 8080
    portName: http
  readinessProbe:
    enabled: true
    path: /
    port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 1
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"
  securityContext:
    pod:
      seccompProfile:
        type: RuntimeDefault
    container:
      allowPrivilegeEscalation: false
      # OCP arbitrary UID; image đã chmod g+rwX group 0
      runAsNonRoot: true
