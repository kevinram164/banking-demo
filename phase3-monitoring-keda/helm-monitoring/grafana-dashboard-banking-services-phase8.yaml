# Grafana Dashboard — Banking Services (Phase 8)
# Sidecar label: grafana_dashboard=1
# Apply: kubectl apply -f grafana-dashboard-banking-services-phase8.yaml -n monitoring
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-banking-services
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Banking
data:
  banking-services.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Request Rate (RPS) by Service",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{namespace=\"npd-banking\"}[5m])) by (job)",
              "legendFormat": "{{job}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },
          "options": {},
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "P95 Latency by Service (seconds)",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{namespace=\"npd-banking\"}[5m])) by (job, le))",
              "legendFormat": "{{job}} p95",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          },
          "options": {},
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Error Rate (5xx) by Service",
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{namespace=\"npd-banking\",status=~\"5..\"}[5m])) by (job) / sum(rate(http_requests_total{namespace=\"npd-banking\"}[5m])) by (job) * 100",
              "legendFormat": "{{job}} %",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          },
          "options": {},
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Auth Service — RPS",
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{namespace=\"npd-banking\"}[5m])) or sum(rate(http_requests_total{namespace=\"npd-banking\",endpoint=~\".*auth.*\"}[5m]))",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },
          "options": {},
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Account Service — RPS",
          "gridPos": {
            "x": 18,
            "y": 8,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{namespace=\"npd-banking\"}[5m])) or sum(rate(http_requests_total{namespace=\"npd-banking\",endpoint=~\".*account.*\"}[5m]))",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },
          "options": {},
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Transfer Service — RPS",
          "gridPos": {
            "x": 12,
            "y": 12,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{namespace=\"npd-banking\"}[5m])) or sum(rate(http_requests_total{namespace=\"npd-banking\",endpoint=~\"/api/transfer.*\"}[5m]))",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },
          "options": {},
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Notification Service — RPS",
          "gridPos": {
            "x": 18,
            "y": 12,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{namespace=\"npd-banking\"}[5m])) or sum(rate(http_requests_total{namespace=\"npd-banking\",endpoint=~\".*notif.*\"}[5m]))",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },
          "options": {},
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Request Rate by Endpoint (Auth)",
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "(sum(rate(http_requests_total{namespace=\"npd-banking\"}[5m])) by (endpoint)) or (sum(rate(http_requests_total{namespace=\"npd-banking\",endpoint=~\".*auth.*\"}[5m])) by (endpoint))",
              "legendFormat": "{{endpoint}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },
          "options": {},
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Request Rate by Status Code",
          "gridPos": {
            "x": 12,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{namespace=\"npd-banking\"}[5m])) by (job, status)",
              "legendFormat": "{{job}} {{status}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },
          "options": {},
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Transfer — Nghiep vu (outcome RPS)",
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "sum(rate(banking_transfer_outcomes_total{namespace=\"npd-banking\",outcome=\"success\"}[5m]))",
              "legendFormat": "Success",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "sum(rate(banking_transfer_outcomes_total{namespace=\"npd-banking\",outcome=\"failed\"}[5m]))",
              "legendFormat": "Failed",
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "sum(rate(banking_transfer_outcomes_total{namespace=\"npd-banking\",outcome=\"pending\"}[5m]))",
              "legendFormat": "Pending",
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "sum(rate(banking_transfer_outcomes_total{namespace=\"npd-banking\",outcome=\"expired\"}[5m]))",
              "legendFormat": "Expired",
              "refId": "D",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "sum(rate(banking_transfer_outcomes_total{namespace=\"npd-banking\",outcome=\"cancelled\"}[5m]))",
              "legendFormat": "Cancelled",
              "refId": "E",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {},
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Business outcomes from transfer-service: success / failed / pending / expired / cancelled (NOT HTTP 2xx). Metric: banking_transfer_outcomes_total"
        },
        {
          "id": 11,
          "type": "gauge",
          "title": "Transfer — % Settle success",
          "gridPos": {
            "x": 12,
            "y": 24,
            "w": 6,
            "h": 8
          },
          "targets": [
            {
              "expr": "100 * sum(rate(banking_transfer_outcomes_total{namespace=\"npd-banking\",outcome=\"success\"}[5m])) / clamp_min(sum(rate(banking_transfer_outcomes_total{namespace=\"npd-banking\",outcome=~\"success|failed|expired|cancelled\"}[5m])), 1e-9)",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 95
                  },
                  {
                    "color": "green",
                    "value": 99
                  }
                ]
              }
            }
          },
          "options": {},
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "success / (success+failed+expired+cancelled). Pending excluded."
        },
        {
          "id": 12,
          "type": "gauge",
          "title": "Transfer — % Creates still open-ish (rate)",
          "gridPos": {
            "x": 18,
            "y": 24,
            "w": 6,
            "h": 8
          },
          "targets": [
            {
              "expr": "100 * sum(rate(banking_transfer_outcomes_total{namespace=\"npd-banking\",outcome=\"pending\"}[5m])) / clamp_min(sum(rate(banking_transfer_outcomes_total{namespace=\"npd-banking\"}[5m])), 1e-9)",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              }
            }
          },
          "options": {},
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Rate share pending creates (khong phai so dang treo). Xem panel Pending (open) de biet hang treo hien tai."
        },
        {
          "id": 20,
          "type": "stat",
          "title": "Transfer — Success (total)",
          "gridPos": {
            "x": 0,
            "y": 32,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "expr": "round(sum(banking_transfer_outcomes_total{namespace=\"npd-banking\",outcome=\"success\"}))",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "green"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "description": "Tong outcome tu khi pod transfer-service start (counter banking_transfer_outcomes_total). Khong phai cua so 1h."
        },
        {
          "id": 21,
          "type": "stat",
          "title": "Transfer — Failed (total)",
          "gridPos": {
            "x": 4,
            "y": 32,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "expr": "round(sum(banking_transfer_outcomes_total{namespace=\"npd-banking\",outcome=\"failed\"}))",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "description": "Tong outcome tu khi pod transfer-service start (counter banking_transfer_outcomes_total). Khong phai cua so 1h."
        },
        {
          "id": 22,
          "type": "stat",
          "title": "Transfer — Pending (open)",
          "gridPos": {
            "x": 8,
            "y": 32,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "expr": "max(banking_transfers_pending{namespace=\"npd-banking\"}) or vector(0)",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "description": "So PENDING dang mo (hold chua confirm/cancel/expire). Ve 0 khi xu ly xong. Metric: banking_transfers_pending"
        },
        {
          "id": 23,
          "type": "stat",
          "title": "Transfer — Expired (total)",
          "gridPos": {
            "x": 12,
            "y": 32,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "expr": "round(sum(banking_transfer_outcomes_total{namespace=\"npd-banking\",outcome=\"expired\"}))",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "description": "Tong outcome tu khi pod transfer-service start (counter banking_transfer_outcomes_total). Khong phai cua so 1h."
        },
        {
          "id": 24,
          "type": "stat",
          "title": "Transfer — Cancelled (total)",
          "gridPos": {
            "x": 16,
            "y": 32,
            "w": 8,
            "h": 4
          },
          "targets": [
            {
              "expr": "round(sum(banking_transfer_outcomes_total{namespace=\"npd-banking\",outcome=\"cancelled\"}))",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "blue",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "description": "Tong outcome tu khi pod transfer-service start (counter banking_transfer_outcomes_total). Khong phai cua so 1h."
        }
      ],
      "refresh": "10s",
      "schemaVersion": 38,
      "tags": [
        "npd",
        "banking",
        "http",
        "phase8"
      ],
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "Prometheus",
              "value": "Prometheus"
            },
            "hide": 0
          }
        ]
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "",
      "title": "NPD Banking Services",
      "uid": "npd-banking-services",
      "version": 1,
      "weekStart": ""
    }
