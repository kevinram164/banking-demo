# IDOT → TechZone
# Symptom: otlp-grpc export fails with
#   "missing selected ALPN property" (OpenShift/TechZone LB không ALPN h2)
# Fix: GRPC_ENFORCE_ALPN_ENABLED=false (grpc-go) — giữ endpoint UI (otlp-grpc)

clusterName: ocp01

instanaEndpoint: otlp-grpc.instana.apps.itz-tdl40p.infra01-lb.dal14.techzone.ibm.com:443

openshift:
  enabled: true
  autoDetect: true
  daemonset:
    usePrivilegedServiceAccount: true

daemonset:
  extraEnvs:
    - name: GRPC_ENFORCE_ALPN_ENABLED
      value: "false"

statefulset:
  extraEnvs:
    - name: GRPC_ENFORCE_ALPN_ENABLED
      value: "false"
