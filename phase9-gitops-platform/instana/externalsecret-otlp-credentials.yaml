# Vault secret/platform/instana → credentials cho shared collector + (optional) IDOT
#
# Seed (vault-0):
#   vault kv put secret/platform/instana key='<INSTANA_KEY_FROM_UI>'
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    app.kubernetes.io/part-of: phase9-gitops
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: instana-otlp-credentials
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: instana-otlp-credentials
    creationPolicy: Owner
  data:
    - secretKey: key
      remoteRef:
        key: platform/instana
        property: key
