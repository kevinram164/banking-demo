# Vault secret/platform/instana → credentials
#
# Seed (trong pod vault-0):
#   vault kv put secret/platform/instana key='<INSTANA_KEY_FROM_UI>'
#
# 1) Shared OTEL collector (ns observability) — env INSTANA_KEY
# 2) Argo Helm valuesFrom (ns argocd) — chart bắt buộc có instanaKey
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    app.kubernetes.io/part-of: phase9-gitops
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: instana-otlp-credentials
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: instana-otlp-credentials
    creationPolicy: Owner
  data:
    - secretKey: key
      remoteRef:
        key: platform/instana
        property: key
---
# Argo CD đọc Secret này khi helm template (valuesFrom)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: instana-idot-helm-values
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: instana-idot-helm-values
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        values.yaml: |
          instanaKey: {{ .key }}
  data:
    - secretKey: key
      remoteRef:
        key: platform/instana
        property: key
