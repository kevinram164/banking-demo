# Blue-Green banking FE — dual Deploy + frontend-edge (sticky cookie)
#
# Weight trình duyệt: frontend.blueGreen.weight (edge nginx split + cookie fe_bg)
#   — BẮT BUỘC sticky: HTML + /static/* cùng version (tránh trang trần).
# HTTPRoute mesh/waypoint: giữ đồng bộ % để mesh-internal / Kiali (tuỳ chọn).
#
# Tag image: values-images.yaml (Jenkins). Không pin tag ở đây.
frontend:
  blueGreen:
    enabled: true
    replicas: 1
    # B1 lab — đổi khi sang B2/B3/B4 (và sửa HTTPRoute cho khớp)
    weight:
      blue: 70
      green: 30
    edge:
      replicas: 1
