# Blue-Green banking FE — dual Deploy + frontend-edge
# Code tách folder:
#   blue  → banking-demo/frontend/           → image .../frontend
#   green → banking-demo/frontend-green/     → image .../frontend-green (tag bump qua values-images.yaml)
#
# Jenkins (shared lib platform@main → Projects.groovy):
#   BUILD_TARGET=frontend       | auto khi đổi frontend/
#   BUILD_TARGET=frontend-green | auto khi đổi frontend-green/
frontend:
  blueGreen:
    enabled: true
    replicas: 1
    blue:
      image:
        tag: "9b04db8"
    green:
      # Fallback nếu chưa có key frontend-green trong values-images; CI ưu tiên values-images
      image:
        repository: harbor-platform.apps.ocp01.npd.co/banking-demo/frontend-green
        tag: "9b04db8"
    edge:
      replicas: 1
