# Blue-Green banking FE — dual Deploy + frontend-edge
# Code tách folder:
#   blue  → banking-demo/frontend/           → image .../frontend
#   green → banking-demo/frontend-green/     → image .../frontend-green
#
# Tag image: chỉ bump trong values-images.yaml (Jenkins).
#   frontend.image.tag       → Deploy frontend-blue
#   frontend-green.image.tag → Deploy frontend-green
# KHÔNG pin tag ở đây — sẽ khóa blue mãi ở bản cũ (mất variant.txt).
#
# Jenkins BUILD_TARGET=frontend | frontend-green | auto
frontend:
  blueGreen:
    enabled: true
    replicas: 1
    edge:
      replicas: 1
