# Phase 9 — OpenTelemetry (merge vào banking Helm apps trên dev-ocp)
# App → OTEL Collector → dual Coroot + Instana agent
# k8s.namespace.name giúp Instana Application Perspective filter Dest Namespace

global:
  observability:
    otelEndpoint: "http://opentelemetry-collector.observability.svc.cluster.local:4317"
    otelProtocol: "grpc"

api-producer:
  extraEnv:
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://opentelemetry-collector.observability.svc.cluster.local:4317"
    OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
    OTEL_SERVICE_NAME: "api-producer"
    OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=dev-ocp,k8s.namespace.name=npd-banking,k8s.cluster.name=ocp01"
    OTEL_HEARTBEAT: "1"
    OTEL_HEARTBEAT_SECONDS: "30"
    # Consumer chết → client nhận 504 sau ~20s (trước đây default 60s quá lâu)
    RABBITMQ_RESPONSE_TIMEOUT: "20"

