# OpenTelemetry Collector — dual Coroot + Instana
# Instana (traces-only apps): cần spanmetrics + k8sattributes + service.instance.id
# Ref: IBM OpenTelemetry service mappings / infrastructure correlation
# Chart: open-telemetry/opentelemetry-collector

fullnameOverride: opentelemetry-collector
mode: deployment
replicaCount: 1

image:
  repository: otel/opentelemetry-collector-contrib

# RBAC + k8sattributes processor (pod uid / namespace / deployment)
presets:
  kubernetesAttributes:
    enabled: true

extraEnvs:
  - name: MY_POD_IP
    valueFrom:
      fieldRef:
        fieldPath: status.podIP

config:
  extensions:
    health_check:
      endpoint: ${env:MY_POD_IP}:13133
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  connectors:
    # Sinh metrics từ spans → Instana tạo OpenTelemetry entity / APM
    spanmetrics: {}
  processors:
    batch:
      timeout: 5s
      send_batch_size: 1024
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25
    # preset kubernetesAttributes injects k8sattributes; resource thêm mapping Instana
    resource:
      attributes:
        - key: cluster.name
          value: ocp01
          action: upsert
        # Instana correlate OTEL entity ↔ pod (insert = không đè SDK)
        - key: service.instance.id
          from_attribute: k8s.pod.uid
          action: insert
  exporters:
    otlphttp/coroot:
      endpoint: http://coroot-coroot.observability.svc.cluster.local:8080
      tls:
        insecure: true
      compression: none
    otlphttp/instana:
      endpoint: http://instana-agent.instana-agent.svc.cluster.local:4318
      tls:
        insecure: true
      compression: none
  service:
    extensions: [health_check]
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, resource, batch]
        exporters: [otlphttp/coroot, otlphttp/instana, spanmetrics]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, resource, batch]
        exporters: [otlphttp/coroot, otlphttp/instana]
      # Metrics sinh từ spans → bắt buộc cho Instana APM (traces-only apps)
      metrics/spanmetrics:
        receivers: [spanmetrics]
        exporters: [otlphttp/instana]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, resource, batch]
        exporters: [otlphttp/coroot, otlphttp/instana]

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

service:
  type: ClusterIP
