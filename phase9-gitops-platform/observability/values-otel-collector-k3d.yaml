# OpenTelemetry Collector — dual Coroot + Instana TechZone (OTLP gRPC)
# Instana UI (Agents → Kubernetes Helm):
#   endpoint = otlp-grpc.instana.apps.itz-tdl40p.infra01-lb.dal14.techzone.ibm.com:443
# Key: Secret instana-otlp-credentials (ns observability) — xem instana/DEPLOY.md
#
# Chart: open-telemetry/opentelemetry-collector

fullnameOverride: opentelemetry-collector
mode: deployment
replicaCount: 1

image:
  repository: otel/opentelemetry-collector-contrib

presets:
  kubernetesAttributes:
    enabled: true

extraEnvs:
  - name: MY_POD_IP
    valueFrom:
      fieldRef:
        fieldPath: status.podIP
  - name: K8S_NODE_NAME
    valueFrom:
      fieldRef:
        fieldPath: spec.nodeName
  - name: INSTANA_KEY
    valueFrom:
      secretKeyRef:
        name: instana-otlp-credentials
        key: key

config:
  extensions:
    health_check:
      endpoint: ${env:MY_POD_IP}:13133
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  connectors:
    # Sinh metrics từ spans → Instana APM (traces-only apps)
    spanmetrics: {}
  processors:
    batch:
      timeout: 5s
      send_batch_size: 1024
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25
    resource:
      attributes:
        - key: cluster.name
          value: ocp01
          action: upsert
        - key: service.instance.id
          from_attribute: k8s.pod.uid
          action: insert
        - key: host.name
          from_attribute: k8s.node.name
          action: insert
    # RabbitMQ INTERNAL *.process → CONSUMER (Instana APM)
    transform/consumer-spans:
      error_mode: ignore
      trace_statements:
        - context: span
          statements:
            - set(kind, 5) where IsMatch(name, ".*\\.process")
            - set(attributes["messaging.system"], "rabbitmq") where IsMatch(name, ".*\\.process")
            - set(attributes["messaging.operation"], "process") where IsMatch(name, ".*\\.process")
  exporters:
    otlphttp/coroot:
      endpoint: http://coroot-coroot.observability.svc.cluster.local:8080
      tls:
        insecure: true
      compression: none
    # Instana TechZone backend (thay local instana-agent)
    otlp/instana:
      endpoint: otlp-grpc.instana.apps.itz-tdl40p.infra01-lb.dal14.techzone.ibm.com:443
      headers:
        x-instana-key: ${env:INSTANA_KEY}
        x-instana-host: ${env:K8S_NODE_NAME}
      tls:
        insecure: false
        # TechZone UI "Not secure" — thường self-signed / internal CA
        insecure_skip_verify: true
      compression: gzip
  service:
    extensions: [health_check]
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, resource, transform/consumer-spans, batch]
        exporters: [otlphttp/coroot, otlp/instana, spanmetrics]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, resource, batch]
        exporters: [otlphttp/coroot, otlp/instana]
      metrics/spanmetrics:
        receivers: [spanmetrics]
        exporters: [otlp/instana]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, resource, batch]
        exporters: [otlphttp/coroot, otlp/instana]

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

service:
  type: ClusterIP
