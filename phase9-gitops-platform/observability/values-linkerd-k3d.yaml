# Linkerd control-plane — OpenShift (RHCOS/nftables) + k3d lab
# Identity: manifest wave 0 (linkerd-identity-bootstrap) + externalCA:true trong Application

cniEnabled: false
controllerReplicas: 1
enablePodAntiAffinity: false

# OCP/RHCOS: iptables-legacy không có → linkerd-init CrashLoopBackOff.
# nft + runAsRoot cần privileged SCC (linkerd-scc-setup.sh).
proxyInit:
  iptablesMode: nft
  runAsRoot: true

# Viz cần policy controller (AuthorizationPolicy, Server CRs)
policyController:
  enabled: true

proxy:
  resources:
    cpu:
      request: 50m
    memory:
      request: 20Mi
      limit: 250Mi

controllerResources:
  cpu:
    request: 50m
  memory:
    request: 256Mi
    limit: 768Mi

heartbeatSchedule: ""

podMonitor:
  enabled: false

enablePodDisruptionBudget: false
