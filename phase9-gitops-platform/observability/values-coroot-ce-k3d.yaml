# Coroot CE — OpenShift dev-ocp (namespace observability)
# UI: https://coroot-platform.apps.ocp01.npd.co (Route: environments/dev-ocp/ocp-values/routes/coroot-route.yaml)
# OTLP: coroot-coroot.observability:4317 (gRPC) / :8080 (HTTP)

storage:
  size: 5Gi
  className: nfs-csi

clickhouse:
  shards: 1
  replicas: 1
  storage:
    size: 10Gi
    className: nfs-csi

prometheus:
  storage:
    size: 5Gi
    className: nfs-csi

# node-agent: DaemonSet trên mọi node (workers + control-plane nếu có tolerations).
# OCP: chạy coroot-node-agent-scc-setup.sh (privileged SCC) sau khi sync.
nodeAgent:
  tolerations:
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  ebpfTracer:
    enabled: false
  ebpfProfiler:
    enabled: false
  logCollector:
    collectLogBasedMetrics: false
    collectLogEntries: false

clusterAgent:
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
