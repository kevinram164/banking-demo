{{- range .Values.users }}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    strimzi.io/cluster: {{ $.Values.clusterName }}
spec:
  authentication:
    type: scram-sha-512
  {{- if $.Values.kafka.enableAuthorization }}
  authorization:
    type: simple
    acls:
      {{- if eq (.role | default "app") "ui" }}
      # Kafbat UI AdminClient — cần cluster + wildcard topic/group
      - resource:
          type: cluster
          name: kafka-cluster
          patternType: literal
        operations: [Describe, DescribeConfigs, Alter, AlterConfigs, ClusterAction, Create]
        host: "*"
      - resource:
          type: topic
          name: "*"
          patternType: literal
        operations: [Describe, Read, Write, Delete, Alter, DescribeConfigs, AlterConfigs, Create]
        host: "*"
      - resource:
          type: group
          name: "*"
          patternType: literal
        operations: [Describe, Read, Delete]
        host: "*"
      - resource:
          type: transactionalId
          name: "*"
          patternType: literal
        operations: [Describe, Write]
        host: "*"
      {{- else }}
      - resource:
          type: topic
          name: orders.events
          patternType: literal
        operations: [Describe, Read, Write]
        host: "*"
      - resource:
          type: topic
          name: payments.events
          patternType: literal
        operations: [Describe, Read, Write]
        host: "*"
      - resource:
          type: group
          name: {{ .groupPrefix }}
          patternType: prefix
        operations: [Describe, Read]
        host: "*"
      {{- end }}
  {{- end }}
{{- end }}
