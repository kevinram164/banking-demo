# Lab NPD — nfs-csi 20Gi, RAM ~4Gi. Auth gần prod: TLS + SCRAM + ACL (không plain).
nameOverride: npd-kafka
fullname: kafka

clusterName: npd-kafka
kafkaVersion: "3.9.0"
metadataVersion: "3.9-IV0"

nodePool:
  name: dual-role
  replicas: 3
  roles:
    - controller
    - broker
  storage:
    size: 20Gi
    class: nfs-csi
    deleteClaim: true
  resources:
    requests:
      cpu: "500m"
      memory: 3Gi
    limits:
      cpu: "2"
      # Tổng pod ~4Gi (đủ lab; Kafka dùng thêm page cache trong limit)
      memory: 4Gi
  jvmOptions:
    "-Xms": 2g
    "-Xmx": 2g
  # OCP + nfs-csi: Kafka chạy UID ns (vd 1000910000). PVC NFS hay root:root → AccessDenied.
  # fsGroup giúp một số CSI; nếu vẫn lỗi → chmod trên volume (xem DEPLOY.md).
  securityContext:
    fsGroup: 1000910000
    fsGroupChangePolicy: OnRootMismatch

kafka:
  # Gần prod: tắt plain — chỉ TLS:9093 + SCRAM + ACL
  rackTopologyKey: ""
  plainListener: false
  tlsScramListener: true
  enableAuthorization: true
  hardAntiAffinity: false
  networkPolicyPeers:
    - namespaceSelector: {}
      podSelector: {}
  config:
    # Quote số lớn thành string — tránh Helm/JSON → scientific notation (e+09)
    # mà Strimzi reject (phải là long/int thuần).
    default.replication.factor: "3"
    min.insync.replicas: "2"
    offsets.topic.replication.factor: "3"
    transaction.state.log.replication.factor: "3"
    transaction.state.log.min.isr: "2"
    auto.create.topics.enable: "false"
    num.partitions: "5"
    # --- Dọn log / giữ PVC 20Gi ---
    log.cleanup.policy: delete
    log.retention.hours: "168"
    # Broker default: max ~1Gi / partition
    log.retention.bytes: "1073741824"
    log.retention.check.interval.ms: "300000"
    log.segment.bytes: "268435456"
    log.roll.ms: "86400000"
    compression.type: lz4

topics:
  - name: orders.events
    partitions: 5
    replicas: 3
  - name: payments.events
    partitions: 5
    replicas: 3

topicDefaults:
  cleanupPolicy: delete
  minInsyncReplicas: "2"
  # 7 ngày
  retentionMs: "604800000"
  # Cap ~2Gi / topic (RF=3 nhân bản trên 3 broker — giữ trong 20Gi/broker)
  retentionBytes: "2147483648"
  segmentBytes: "268435456"
  compressionType: lz4

users:
  - name: npd-shop
    groupPrefix: noli-
  - name: npd-banking
    groupPrefix: banking-
  # Kafka UI — ACL rộng cho AdminClient (Describe cluster, list topics, …)
  - name: kafka-ui
    role: ui
    groupPrefix: kafka-ui-

metrics:
  enabled: true
