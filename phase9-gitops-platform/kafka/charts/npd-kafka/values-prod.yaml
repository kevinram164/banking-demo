# Lab “gần prod” overlay (tùy chọn) — mặc định đã nằm trong values.yaml
# (plain off, TLS+SCRAM+ACL, nfs-csi 20Gi).
nodePool:
  storage:
    size: 20Gi
    class: nfs-csi
    deleteClaim: true
  resources:
    requests:
      cpu: "500m"
      memory: 3Gi
    limits:
      cpu: "2"
      memory: 4Gi
  jvmOptions:
    "-Xms": 2g
    "-Xmx": 2g

kafka:
  plainListener: false
  tlsScramListener: true
  enableAuthorization: true
