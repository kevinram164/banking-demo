# DEPRECATED cho OCP GitOps — chart bắt buộc instanaKey lúc helm template,
# multi-source Application không inject Secret/parameters → ComparisonError mãi.
#
# Dùng Helm + ESO thay thế:
#   ./phase9-gitops-platform/instana/scripts/install-idot.sh
#
# File giữ lại để tham khảo; không apply trên cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-instana-otel-collector
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: phase9-gitops
    app.kubernetes.io/component: observability
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: banking-platform
  sources:
    - repoURL: https://instana.github.io/instana-otel-collector
      chart: instana-otel-collector-chart
      targetRevision: "*"
      helm:
        releaseName: instana-otel-collector
        valueFiles:
          - $values/phase9-gitops-platform/instana/values-idot-ocp.yaml
    - repoURL: https://github.com/kevinram164/banking-demo.git
      targetRevision: dev-ocp
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: instana-otel-collector
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
