# Instana OTel Collector (IDOT) — K8s infra → TechZone
# instanaKey KHÔNG commit — sau apply chạy:
#   ./phase9-gitops-platform/instana/scripts/sync-idot-key-from-vault.sh
# (đọc Secret ESO đã sync từ Vault, patch helm.parameters trên Application)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-instana-otel-collector
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: phase9-gitops
    app.kubernetes.io/component: observability
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: banking-platform
  sources:
    - repoURL: https://instana.github.io/instana-otel-collector
      chart: instana-otel-collector-chart
      targetRevision: "*"
      helm:
        releaseName: instana-otel-collector
        valueFiles:
          - $values/phase9-gitops-platform/instana/values-idot-ocp.yaml
        # parameters.instanaKey được script sync-idot-key-from-vault.sh patch vào (live trên cluster)
    - repoURL: https://github.com/kevinram164/banking-demo.git
      targetRevision: dev-ocp
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: instana-otel-collector
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: false
      selfHeal: true
