# Instana OTel Collector (IDOT) — K8s infra → TechZone
# Prerequisite: set instanaKey via Helm (Application ignoreDifferences / manual helm)
# Prefer: ./instana/scripts/install-idot.sh với INSTANA_KEY
#
# Argo không chứa key trong git — sync sau khi secret/helm param đã set trên cluster,
# hoặc dùng helm CLI script làm source of truth.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-instana-otel-collector
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: phase9-gitops
    app.kubernetes.io/component: observability
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: banking-platform
  sources:
    - repoURL: https://instana.github.io/instana-otel-collector
      chart: instana-otel-collector-chart
      targetRevision: "*"
      helm:
        releaseName: instana-otel-collector
        valueFiles:
          - $values/phase9-gitops-platform/instana/values-idot-ocp.yaml
        # Key: điền trên cluster / ExternalSecret workflow — KHÔNG commit
        # parameters:
        #   - name: instanaKey
        #     value: "<set-out-of-band>"
    - repoURL: https://github.com/kevinram164/banking-demo.git
      targetRevision: dev-ocp
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: instana-otel-collector
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    # Tắt auto cho đến khi instanaKey được inject ngoài band
    # automated:
    #   prune: false
    #   selfHeal: true
