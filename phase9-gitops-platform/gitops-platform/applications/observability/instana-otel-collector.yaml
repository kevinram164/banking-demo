# Instana OTel Collector (IDOT) — K8s infra → TechZone
# instanaKey nằm trong values-idot-ocp.yaml (OCP GitOps multi-source bỏ qua valuesFrom)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-instana-otel-collector
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: phase9-gitops
    app.kubernetes.io/component: observability
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: banking-platform
  sources:
    - repoURL: https://instana.github.io/instana-otel-collector
      chart: instana-otel-collector-chart
      targetRevision: "*"
      helm:
        releaseName: instana-otel-collector
        valueFiles:
          - $values/phase9-gitops-platform/instana/values-idot-ocp.yaml
        # Backup nếu valueFiles trên git chưa kịp pull
        parameters:
          - name: instanaKey
            value: WUinQgrHRCSVCdvntU5UhA
    - repoURL: https://github.com/kevinram164/banking-demo.git
      targetRevision: dev-ocp
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: instana-otel-collector
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: false
      selfHeal: true
