# Shared platform — Strimzi Operator (Helm) · ns kafka
# Cùng pattern Postgres/Redis: Helm chart upstream + ArgoCD Application trong infra/
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-strimzi
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: phase9-gitops
    app.kubernetes.io/component: kafka
    npd/shared-platform: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: banking-platform
  source:
    repoURL: https://strimzi.io/charts/
    chart: strimzi-kafka-operator
    targetRevision: 0.45.0
    helm:
      releaseName: strimzi-kafka-operator
      values: |
        # Operator chỉ watch ns kafka (shared cluster lives here)
        watchNamespaces:
          - kafka
        watchAnyNamespace: false
        resources:
          requests:
            cpu: 200m
            memory: 384Mi
          limits:
            cpu: "1"
            memory: 768Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: false
      selfHeal: true
