# Shared platform — Strimzi Operator (Helm) · ns kafka
#
# OCP mới trả /version field "emulationMajor" → Strimzi 0.45 crash
# (fabric8 VersionInfo UnrecognizedPropertyException).
# Fix: chart ≥0.46 + env STRIMZI_KUBERNETES_VERSION bypass.
# https://github.com/strimzi/strimzi-kafka-operator/issues/11386
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-strimzi
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: phase9-gitops
    app.kubernetes.io/component: kafka
    npd/shared-platform: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: banking-platform
  source:
    repoURL: https://strimzi.io/charts/
    chart: strimzi-kafka-operator
    targetRevision: 0.46.1
    helm:
      releaseName: strimzi-kafka-operator
      values: |
        watchNamespaces:
          - kafka
        watchAnyNamespace: false
        extraEnvs:
          - name: STRIMZI_KUBERNETES_VERSION
            value: "major=1,minor=30"
        resources:
          requests:
            cpu: 200m
            memory: 384Mi
          limits:
            cpu: "1"
            memory: 768Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: false
      selfHeal: true
