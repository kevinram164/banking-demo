# Shared platform — Kafka UI (Kafbat, Helm) · ns kafka
# Monitor topics / consumer groups / messages cho cluster npd-kafka
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-kafka-ui
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: phase9-gitops
    app.kubernetes.io/component: kafka-ui
    npd/shared-platform: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: banking-platform
  source:
    repoURL: https://kafbat.github.io/helm-charts
    chart: kafka-ui
    targetRevision: 1.5.0
    helm:
      releaseName: kafka-ui
      values: |
        replicaCount: 1
        yamlApplicationConfig:
          kafka:
            clusters:
              - name: npd-kafka
                bootstrapServers: npd-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092
                # Readonly lab optional — bỏ comment nếu chỉ xem, không produce từ UI:
                # readOnly: true
          auth:
            type: DISABLED
        service:
          type: ClusterIP
          port: 80
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        # OCP: unprivileged
        podSecurityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: false
      selfHeal: true
