# Shared platform — Kafka UI (Kafbat) · TLS + SCRAM tới npd-kafka
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-kafka-ui
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: phase9-gitops
    app.kubernetes.io/component: kafka-ui
    npd/shared-platform: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: banking-platform
  source:
    repoURL: https://kafbat.github.io/helm-charts
    chart: kafka-ui
    targetRevision: 1.5.0
    helm:
      releaseName: kafka-ui
      values: |
        replicaCount: 1
        yamlApplicationConfig:
          kafka:
            clusters:
              - name: npd-kafka
                bootstrapServers: npd-kafka-kafka-bootstrap.kafka.svc.cluster.local:9093
                properties:
                  security.protocol: SASL_SSL
                  sasl.mechanism: SCRAM-SHA-512
                  ssl.truststore.location: /etc/kafka/certs/ca.p12
                  ssl.truststore.type: PKCS12
          auth:
            type: DISABLED
        env:
          - name: KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG
            valueFrom:
              secretKeyRef:
                name: kafka-ui
                key: sasl.jaas.config
          - name: KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: npd-kafka-cluster-ca-cert
                key: ca.password
          - name: KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_LOCATION
            value: /etc/kafka/certs/ca.p12
        volumeMounts:
          - name: cluster-ca
            mountPath: /etc/kafka/certs
            readOnly: true
        volumes:
          - name: cluster-ca
            secret:
              secretName: npd-kafka-cluster-ca-cert
        service:
          type: ClusterIP
          port: 80
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        podSecurityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: false
      selfHeal: true
