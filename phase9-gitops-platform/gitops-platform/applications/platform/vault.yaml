# HashiCorp Vault — dev-ocp: https://vault-platform.apps.ocp01.npd.co (dev mode, lab only)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-vault
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: phase9-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: banking-platform
  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: vault
    targetRevision: 0.28.1
    helm:
      releaseName: vault
      parameters:
        - name: injector.enabled
          value: "false"
        - name: global.openshift
          value: "true"
      values: |
        # OCP: image Red Hat UBI (-ubi suffix); injector tắt (Phase 9 dùng ESO)
        # Standalone + file storage (PVC nfs-csi) — data sống qua restart.
        # Sau MỖI lần pod restart: vault operator unseal (3/5 key từ operator init).
        global:
          openshift: true
        injector:
          enabled: false
        server:
          ha:
            enabled: false
          dev:
            enabled: false
          standalone:
            enabled: true
            config: |
              ui = true
              listener "tcp" {
                address     = "[::]:8200"
                cluster_address = "[::]:8201"
                tls_disable = 1
              }
              storage "file" {
                path = "/vault/data"
              }
          dataStorage:
            enabled: true
            size: 2Gi
            storageClass: nfs-csi
            accessMode: ReadWriteOnce
          image:
            repository: registry.connect.redhat.com/hashicorp/vault
            tag: "1.17.2-ubi"
          # 204 = uninitialized, 429 = standby, 501 = not init, 503 = sealed — pod vẫn Ready để exec init/unseal
          readinessProbe:
            path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204"
          ingress:
            enabled: false
        ui:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
