# Jenkins — dev-ocp: UI https://jenkins-platform.apps.ocp01.npd.co
# Admin: Vault secret/platform/jenkins → ESO → Helm existingSecret
# Pipeline CI: agent SA jenkins-kaniko đọc trực tiếp Vault (platform/harbor, platform/github)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-jenkins
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: phase9-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: banking-platform
  source:
    repoURL: https://charts.jenkins.io
    chart: jenkins
    targetRevision: 5.7.27
    helm:
      releaseName: jenkins
      values: |
        persistence:
          enabled: true
          storageClass: nfs-csi
          size: 8Gi
          accessMode: ReadWriteOnce
        controller:
          image:
            registry: docker.io
            repository: jenkins/jenkins
            tag: "lts-jdk17"
            pullPolicy: Always
          admin:
            existingSecret: jenkins-platform-credentials
            userKey: jenkins-admin-user
            passwordKey: jenkins-admin-password
          jenkinsUrl: https://jenkins-platform.apps.ocp01.npd.co/
          # false: dependency lấy bản tối thiểu tương thích (không kéo :latest lẫn lộn)
          installLatestPlugins: false
          # Pin version — KHÔNG dùng id "stage-view" (404). UI Stage View = pipeline-stage-view (optional).
          installPlugins:
            - kubernetes:4437.v3a_18554d3f32
            - workflow-aggregator:608.v67378e9d3db_1
            - pipeline-model-api:2.2255.v56a_15e805f12
            - pipeline-model-definition:2.2255.v56a_15e805f12
            - pipeline-model-extensions:2.2255.v56a_15e805f12
            - workflow-multibranch:821.vc3b_4ea_780798
            - git:5.10.1
            - configuration-as-code:2100.vb_fd699d2a_09c
            - pipeline-groovy-lib:798.v5cc688825312
            - durable-task:686.v80ff80875b_82
            # Keycloak / OIDC (Phase 3) — pin bản tồn tại trên updates.jenkins.io (4.520... = 404)
            - oic-auth:4.690.v5821cf665e43
          additionalPlugins: []
          overwritePlugins: true
          overwritePluginsFromImage: false
          initializeOnce: false
          podSecurityContextOverride:
            # UID do OpenShift cấp theo openshift.io/sa.scc.uid-range (ns platform)
            # Sau sync: scripts/namespace-scc-setup.sh platform
            fsGroupChangePolicy: OnRootMismatch
            runAsNonRoot: true
          containerSecurityContext:
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            runAsNonRoot: true
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 2Gi
          # Secret OIDC: scripts/jenkins-oidc-keycloak.sh
          # Admin escape hatch: cùng secret jenkins-platform-credentials (Vault/ESO)
          containerEnv:
            - name: JENKINS_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jenkins-oidc-keycloak
                  key: client-secret
                  optional: true
            - name: JENKINS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jenkins-platform-credentials
                  key: jenkins-admin-password
                  optional: true
          # Đổi javaOpts → Argo sync STS → pod restart (đúng hành vi). Không phải crash Kaniko.
          javaOpts: >-
            -Dorg.jenkinsci.plugins.durabletask.BourneShellScript.HEARTBEAT_CHECK_INTERVAL=86400
            -Dorg.jenkinsci.plugins.durabletask.BourneShellScript.USE_BINARY_WRAPPER=true
          initContainerResources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 2Gi
          JCasC:
            defaultConfig: true
            configScripts:
              banking-shared-library: |
                unclassified:
                  globalLibraries:
                    libraries:
                      - name: "banking-demo"
                        defaultVersion: "dev-ocp"
                        retriever:
                          modernSCM:
                            libraryPath: "phase9-gitops-platform/jenkins-shared-library"
                            scm:
                              git:
                                remote: "https://github.com/kevinram164/banking-demo.git"
              # OIDC Keycloak — lab: mọi user SSO = admin
              # Schema oic-auth ≥4.6xx: serverConfiguration.wellKnown + properties.escapeHatch
              # Chạy jenkins-oidc-keycloak.sh trước khi sync (tạo secret).
              keycloak-oidc: |
                jenkins:
                  securityRealm:
                    oic:
                      clientId: "jenkins"
                      clientSecret: "${JENKINS_OIDC_CLIENT_SECRET}"
                      serverConfiguration:
                        wellKnown:
                          wellKnownOpenIDConfigurationUrl: "https://keycloak-platform.apps.ocp01.npd.co/realms/platform/.well-known/openid-configuration"
                          scopesOverride: "openid profile email"
                      userNameField: "preferred_username"
                      fullNameFieldName: "name"
                      emailFieldName: "email"
                      groupsFieldName: "groups"
                      logoutFromOpenidProvider: true
                      postLogoutRedirectUrl: "https://jenkins-platform.apps.ocp01.npd.co/"
                      disableSslVerification: true
                      properties:
                        - escapeHatch:
                            username: "admin"
                            secret: "${JENKINS_ADMIN_PASSWORD}"
                  authorizationStrategy:
                    loggedInUsersCanDoAnything:
                      allowAnonymousRead: false
          ingress:
            enabled: false
        agent:
          enabled: true
          kubernetes:
            namespace: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
