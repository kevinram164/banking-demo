# profile: ambient bắt buộc (cùng IstioCNI). OpenShift: seLinuxOptions spc_t.
# Argo mesh-ztunnel: không dùng SSA (schema v1 không khai báo mọi field).
apiVersion: sailoperator.io/v1alpha1
kind: ZTunnel
metadata:
  name: default
spec:
  namespace: ztunnel
  profile: ambient
  values:
    seLinuxOptions:
      type: spc_t
