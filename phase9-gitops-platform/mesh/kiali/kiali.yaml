apiVersion: kiali.io/v1alpha1
kind: Kiali
metadata:
  name: kiali
  namespace: kiali
spec:
  istio_namespace: istio-system
  auth:
    strategy: anonymous
  deployment:
    accessible_namespaces:
      - "**"
  external_services:
    prometheus:
      # Istio metrics (ztunnel istio_tcp_*) trong UWM — không dùng openshift-monitoring Thanos.
      url: "https://prometheus-user-workload.openshift-user-workload-monitoring.svc:9092"
      # UWM không trả 2xx cho /-/healthy → Kiali báo "prometheus disabled"
      health_check_url: "https://prometheus-user-workload.openshift-user-workload-monitoring.svc:9092/api/v1/query?query=up"
      auth:
        type: bearer
        use_kiali_token: true
        insecure_skip_verify: true
      is_core: true
      thanos_proxy:
        enabled: false
    grafana:
      enabled: false
    tracing:
      enabled: false
