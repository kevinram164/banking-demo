apiVersion: kiali.io/v1alpha1
kind: Kiali
metadata:
  name: kiali
  namespace: kiali
spec:
  istio_namespace: istio-system
  auth:
    strategy: anonymous
  deployment:
    accessible_namespaces:
      - "**"
  external_services:
    prometheus:
      # Istio metrics (ztunnel istio_tcp_*) nằm trong UWM — không phải openshift-monitoring.
      url: "https://prometheus-user-workload.openshift-user-workload-monitoring.svc:9092"
      auth:
        type: bearer
        use_kiali_token: true
        insecure_skip_verify: true
      thanos_proxy:
        enabled: false
    grafana:
      enabled: false
    tracing:
      enabled: false
