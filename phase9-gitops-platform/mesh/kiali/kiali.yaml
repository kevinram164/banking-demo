apiVersion: kiali.io/v1alpha1
kind: Kiali
metadata:
  name: kiali
  namespace: kiali
spec:
  istio_namespace: istio-system
  auth:
    strategy: anonymous
  deployment:
    accessible_namespaces:
      - "**"
  external_services:
    prometheus:
      # OCP: Thanos Querier gộp platform + UWM (istio_tcp_* từ PodMonitor ztunnel).
      # KHÔNG trỏ thẳng prometheus-user-workload:9092 — kube-rbac-proxy trả 404 cho Kiali health.
      url: "https://thanos-querier.openshift-monitoring.svc:9091"
      health_check_url: "https://thanos-querier.openshift-monitoring.svc:9091/-/healthy"
      auth:
        type: bearer
        use_kiali_token: true
        insecure_skip_verify: true
      is_core: true
      thanos_proxy:
        enabled: true
        url: "https://thanos-querier.openshift-monitoring.svc:9091"
        thanos_health_check_url: "https://thanos-querier.openshift-monitoring.svc:9091/-/healthy"
    grafana:
      enabled: false
    tracing:
      enabled: false
