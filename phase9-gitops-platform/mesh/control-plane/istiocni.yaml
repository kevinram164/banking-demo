# Bắt buộc profile: ambient — CNI node agent tạo /var/run/ztunnel/ztunnel.sock.
# Không có → ztunnel log: "failed to connect ... ztunnel.sock ... NotFound".
# Không set spec.values.resources (CRD Sail không khai báo → Argo diff fail).
apiVersion: sailoperator.io/v1
kind: IstioCNI
metadata:
  name: default
spec:
  namespace: istio-cni
  profile: ambient
  values:
    cni:
      ambient:
        reconcileIptablesOnStartup: true
    # OCP 4.20+ RHCOS 10: bật nếu redirect vẫn lỗi sau profile ambient
    global:
      nativeNftables: true
