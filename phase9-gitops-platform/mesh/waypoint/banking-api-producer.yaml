apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: waypoint
  namespace: npd-banking
  labels:
    istio.io/waypoint-for: service
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
---
# Blue-green: thêm backendRef thứ 2 + weight 0/100. Hiện 100% service hiện tại.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-producer-bluegreen
  namespace: npd-banking
spec:
  parentRefs:
    - name: waypoint
  rules:
    - backendRefs:
        - name: api-producer
          port: 8080
          weight: 100
