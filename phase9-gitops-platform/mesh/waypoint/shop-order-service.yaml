# Copy cũng nằm repo npd-shop/deploy/mesh/waypoint.yaml — file này để kustomize waypoint banking-demo đủ resource.
# Blue-green shop: HTTPRoute weight trên order-service (ns npd-shop).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: waypoint
  namespace: npd-shop
  labels:
    istio.io/waypoint-for: service
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: order-service-bluegreen
  namespace: npd-shop
spec:
  parentRefs:
    - name: waypoint
  rules:
    - backendRefs:
        - name: order-service
          port: 8003
          weight: 100
