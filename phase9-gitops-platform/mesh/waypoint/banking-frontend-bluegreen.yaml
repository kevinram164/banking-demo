# Đợt H-FE — Blue-Green banking frontend (HTTPRoute weights).
# Reuse Gateway waypoint trong banking-api-producer.yaml (ns npd-banking).
# Sync tay: argocd app sync mesh-waypoint
#
# Weight steps (sửa backendRefs rồi sync):
#   B0 100/0 → B1 70/30 → B2 50/50 → B3 30/70 → B4 0/100
# Chi tiết: ../BLUE-GREEN-BANKING-FRONTEND.md
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-bluegreen
  namespace: npd-banking
  labels:
    app.kubernetes.io/part-of: banking-bluegreen
    banking-demo/traffic-step: B1-70-30
spec:
  parentRefs:
    - group: ""
      kind: Service
      name: frontend
      port: 80
  rules:
    - backendRefs:
        - name: frontend-blue
          port: 80
          weight: 70
        - name: frontend-green
          port: 80
          weight: 30
