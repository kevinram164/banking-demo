# OpenSearch Dashboards — trỏ Service đang chạy: opensearch-cluster-master

opensearchHosts: "http://opensearch-cluster-master.logging.svc.cluster.local:9200"

extraEnvs:
  - name: DISABLE_SECURITY_DASHBOARDS_PLUGIN
    value: "true"
  - name: OPENSEARCH_HOSTS
    value: '["http://opensearch-cluster-master.logging.svc.cluster.local:9200"]'

resources:
  requests:
    cpu: "100m"
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

service:
  type: ClusterIP
  port: 5601

ingress:
  enabled: false

podSecurityContext:
  fsGroup: 1000
  runAsUser: 1000
  runAsNonRoot: true

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false

serviceAccount:
  create: true
  name: opensearch-dashboards
