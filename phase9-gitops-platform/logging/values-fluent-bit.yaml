# Fluent Bit → OpenSearch — tách index bank/shop/movie/infra
# OCP CRI-O: mount /var/log + runAsUser 0 + SCC fluent-bit-npd (hostPath)

kind: DaemonSet

image:
  repository: cr.fluentbit.io/fluent/fluent-bit
  tag: 3.2.2

openShift:
  enabled: true
  securityContextConstraints:
    create: false
    # Dùng SCC GitOps: environments/dev-ocp/ocp-values/scc/fluent-bit-scc.yaml
    existingName: fluent-bit-npd

serviceAccount:
  create: true
  name: fluent-bit

rbac:
  create: true
  nodeAccess: true

# Bắt buộc để đọc log host trên OCP
podSecurityContext:
  runAsUser: 0
  runAsNonRoot: false

securityContext:
  runAsUser: 0
  runAsNonRoot: false
  allowPrivilegeEscalation: true
  readOnlyRootFilesystem: false
  seLinuxOptions:
    type: spc_t

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 512Mi

tolerations:
  - operator: Exists

# OCP CRI-O: chỉ cần /var/log (chứa pods/ + containers/ symlink)
# Không mount /var/lib/docker (không có trên OCP) /etc/machine-id type:File dễ fail
daemonSetVolumes:
  - name: varlog
    hostPath:
      path: /var/log

daemonSetVolumeMounts:
  - name: varlog
    mountPath: /var/log
    readOnly: true

config:
  service: |
    [SERVICE]
        Daemon Off
        Flush 5
        Log_Level info
        Parsers_File /fluent-bit/etc/parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
        Health_Check On

  inputs: |
    [INPUT]
        Name              tail
        Path              /var/log/pods/*/*/*.log
        Exclude_Path      /var/log/pods/*/*fluent-bit*/**,/var/log/pods/*/fluent-bit*/**
        multiline.parser  cri
        Tag               kube.*
        Mem_Buf_Limit     32MB
        Skip_Long_Lines   On
        Refresh_Interval  5
        DB                /tmp/flb_kube.db
        Path_Key          filepath

  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On
        Labels              Off
        Annotations         Off
        Kube_Tag_Prefix     kube.var.log.pods.

    [FILTER]
        Name    grep
        Match   kube.*
        Regex   $kubernetes['namespace_name'] ^(npd-banking|npd-shop|npd-movie|kafka|platform|observability|logging|argocd|kong|vault|postgres|redis|rabbit|minio|external-secrets)$

    [FILTER]
        Name    grep
        Match   kube.*
        Exclude $kubernetes['container_name'] ^(fluent-bit|POD|pause|linkerd-proxy)$

    [FILTER]
        Name          rewrite_tag
        Match         kube.*
        Rule          $kubernetes['namespace_name'] ^npd-banking$ logs.bank false
        Rule          $kubernetes['namespace_name'] ^npd-shop$ logs.shop false
        Rule          $kubernetes['namespace_name'] ^npd-movie$ logs.movie false
        Rule          $kubernetes['namespace_name'] ^(kafka|platform|observability|logging|argocd|kong|vault|postgres|redis|rabbit|minio|external-secrets)$ logs.infra false
        Emitter_Name  re_emitted
        Emitter_Storage.type memory

  outputs: |
    [OUTPUT]
        Name               opensearch
        Match              logs.bank
        Host               opensearch-cluster-master
        Port               9200
        TLS                Off
        Suppress_Type_Name On
        Logstash_Format    On
        Logstash_Prefix    logs-bank
        Logstash_DateFormat %Y.%m.%d
        Replace_Dots       On
        Retry_Limit        False
        Trace_Error        On
        Generate_ID        On

    [OUTPUT]
        Name               opensearch
        Match              logs.shop
        Host               opensearch-cluster-master
        Port               9200
        TLS                Off
        Suppress_Type_Name On
        Logstash_Format    On
        Logstash_Prefix    logs-shop
        Logstash_DateFormat %Y.%m.%d
        Replace_Dots       On
        Retry_Limit        False
        Trace_Error        On
        Generate_ID        On

    [OUTPUT]
        Name               opensearch
        Match              logs.movie
        Host               opensearch-cluster-master
        Port               9200
        TLS                Off
        Suppress_Type_Name On
        Logstash_Format    On
        Logstash_Prefix    logs-movie
        Logstash_DateFormat %Y.%m.%d
        Replace_Dots       On
        Retry_Limit        False
        Trace_Error        On
        Generate_ID        On

    [OUTPUT]
        Name               opensearch
        Match              logs.infra
        Host               opensearch-cluster-master
        Port               9200
        TLS                Off
        Suppress_Type_Name On
        Logstash_Format    On
        Logstash_Prefix    logs-infra
        Logstash_DateFormat %Y.%m.%d
        Replace_Dots       On
        Retry_Limit        False
        Trace_Error        On
        Generate_ID        On

hotReload:
  enabled: false
