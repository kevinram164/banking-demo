# Fluent Bit → OpenSearch — chỉ log ns: npd-banking, npd-shop, kafka
# Chart: fluent/fluent-bit (https://fluent.github.io/helm-charts)

kind: DaemonSet

image:
  repository: cr.fluentbit.io/fluent/fluent-bit
  tag: 3.2.2

openShift:
  enabled: true
  securityContextConstraints:
    create: true
    name: fluent-bit-npd

serviceAccount:
  create: true
  name: fluent-bit

rbac:
  create: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

tolerations:
  - operator: Exists

config:
  service: |
    [SERVICE]
        Daemon Off
        Flush 5
        Log_Level info
        Parsers_File /fluent-bit/etc/parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
        Health_Check On

  inputs: |
    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        multiline.parser  cri
        Tag               kube.*
        Mem_Buf_Limit     32MB
        Skip_Long_Lines   On
        Refresh_Interval  5
        DB                /tmp/flb_kube.db

  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On
        Labels              Off
        Annotations         Off

    [FILTER]
        Name    grep
        Match   kube.*
        Regex   $kubernetes['namespace_name'] ^(npd-banking|npd-shop|kafka)$

    [FILTER]
        Name    grep
        Match   kube.*
        Exclude $kubernetes['container_name'] ^(fluent-bit|POD|pause|linkerd-proxy)$

  outputs: |
    [OUTPUT]
        Name               opensearch
        Match              kube.*
        Host               npd-logs-master
        Port               9200
        TLS                Off
        Suppress_Type_Name On
        Logstash_Format    On
        Logstash_Prefix    npd
        Logstash_DateFormat %Y.%m.%d
        Replace_Dots       On
        Retry_Limit        False
        Trace_Error        On
        Generate_ID        On

hotReload:
  enabled: false
