# Alertmanager → Telegram (alerts namespace=npd-banking)
# message mặc định của AM (tránh lỗi Go template custom).
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: npd-telegram
  namespace: npd-banking
  labels:
    app.kubernetes.io/part-of: npd-monitoring
    alertmanagerConfig: aiops
spec:
  route:
    receiver: telegram
    groupBy:
      - alertname
    groupWait: 0s
    groupInterval: 1m
    repeatInterval: 30m
    routes:
      - receiver: telegram
        matchers:
          - name: severity
            matchType: =~
            value: warning|critical
  receivers:
    - name: telegram
      telegramConfigs:
        - botToken:
            name: alertmanager-telegram
            key: bot-token
          chatID: -1004489182185
          parseMode: HTML
          sendResolved: true
          message: '{{ .CommonLabels.alertname }} [{{ .Status }}] {{ .CommonAnnotations.summary }}'
