# Secret — tạo thủ công (KHÔNG commit token thật):
#   oc -n npd-banking create secret generic alertmanager-telegram \
#     --from-literal=bot-token='123456:ABC...' \
#     --from-literal=chat-id='-100xxxxxxxxxx'
#
# Copy secret sang các ns cần Telegram: npd-shop, openshift-monitoring, postgres, kafka, kong, rabbit
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-telegram
  namespace: npd-banking
  labels:
    app.kubernetes.io/part-of: npd-monitoring
type: Opaque
stringData:
  bot-token: "REPLACE_BOT_TOKEN"
  # chat-id chỉ để reference — AlertmanagerConfig dùng giá trị số trong CR
  chat-id: "REPLACE_CHAT_ID"
