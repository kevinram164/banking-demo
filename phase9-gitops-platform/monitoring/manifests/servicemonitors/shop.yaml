apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: npd-shop-services
  namespace: npd-shop
  labels:
    app.kubernetes.io/part-of: npd-monitoring
spec:
  namespaceSelector:
    matchNames: [npd-shop]
  selector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - gateway
          - auth-service
          - catalog-service
          - order-service
          - payment-worker
          - shop-web
  endpoints:
    - targetPort: 8080
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      honorLabels: true
      relabelings:
        - action: labeldrop
          regex: endpoint
---
# oc -n npd-shop delete servicemonitor npd-shop-services-name --ignore-not-found
