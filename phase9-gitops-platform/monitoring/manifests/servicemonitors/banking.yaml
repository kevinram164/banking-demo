# Scrape /metrics — npd-banking
# QUAN TRỌNG: Prometheus Operator gắn label target `endpoint`=<port>, đè label app
# `endpoint`=/api/... → dashboard transfer chết. Fix: honorLabels + labeldrop endpoint.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: banking-api-producer
  namespace: npd-banking
  labels:
    app.kubernetes.io/part-of: npd-monitoring
spec:
  namespaceSelector:
    matchNames: [npd-banking]
  selector:
    matchLabels:
      app.kubernetes.io/name: api-producer
  endpoints:
    - targetPort: 8080
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      honorLabels: true
      relabelings:
        - action: labeldrop
          regex: endpoint
---
