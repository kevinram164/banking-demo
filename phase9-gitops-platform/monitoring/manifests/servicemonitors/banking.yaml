# Scrape /metrics — ns npd-banking (UWM)
# Dùng targetPort (số) để khỏi phụ thuộc tên port Service = "http".
# Selector: cả app.kubernetes.io/name và app: (Helm cũ).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: banking-api-producer
  namespace: npd-banking
  labels:
    app.kubernetes.io/part-of: npd-monitoring
spec:
  namespaceSelector:
    matchNames:
      - npd-banking
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - api-producer
  endpoints:
    - targetPort: 8080
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
# Fallback nếu Service chỉ có label app=api-producer
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: banking-api-producer-app
  namespace: npd-banking
  labels:
    app.kubernetes.io/part-of: npd-monitoring
spec:
  namespaceSelector:
    matchNames:
      - npd-banking
  selector:
    matchLabels:
      app: api-producer
  endpoints:
    - targetPort: 8080
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: banking-services
  namespace: npd-banking
  labels:
    app.kubernetes.io/part-of: npd-monitoring
spec:
  namespaceSelector:
    matchNames:
      - npd-banking
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - auth-service
          - account-service
          - transfer-service
          - notification-service
          - shop-bridge
          - frontend
          - api-producer
  endpoints:
    - targetPort: 8080
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
    - targetPort: 8001
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
    - targetPort: 8002
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
    - targetPort: 8003
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
    - targetPort: 8004
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
    - targetPort: 8010
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
