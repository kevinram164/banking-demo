# Infra exporters — targetPort số (Service Bitnami/Strimzi thường không tên port chuẩn)
# Sau apply: oc -n redis|postgres|kong|kafka|rabbit get svc --show-labels
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redis-metrics
  namespace: redis
  labels:
    app.kubernetes.io/part-of: npd-monitoring
spec:
  namespaceSelector:
    matchNames: [redis]
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [redis]
  endpoints:
    - targetPort: 9121
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redis-metrics-by-component
  namespace: redis
  labels:
    app.kubernetes.io/part-of: npd-monitoring
spec:
  namespaceSelector:
    matchNames: [redis]
  selector:
    matchLabels:
      app.kubernetes.io/component: metrics
  endpoints:
    - targetPort: 9121
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: postgres-metrics
  namespace: postgres
  labels:
    app.kubernetes.io/part-of: npd-monitoring
spec:
  namespaceSelector:
    matchNames: [postgres]
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [postgresql, postgres]
  endpoints:
    - targetPort: 9187
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: postgres-metrics-component
  namespace: postgres
  labels:
    app.kubernetes.io/part-of: npd-monitoring
spec:
  namespaceSelector:
    matchNames: [postgres]
  selector:
    matchLabels:
      app.kubernetes.io/component: metrics
  endpoints:
    - targetPort: 9187
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kong-metrics
  namespace: kong
  labels:
    app.kubernetes.io/part-of: npd-monitoring
spec:
  namespaceSelector:
    matchNames: [kong]
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [kong]
  endpoints:
    - targetPort: 8001
      path: /metrics
      interval: 15s
    - targetPort: 8444
      path: /metrics
      interval: 15s
---
# Strimzi Kafka Exporter — cluster lab KHÔNG có Service exporter → dùng PodMonitor
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kafka-exporter
  namespace: kafka
  labels:
    app.kubernetes.io/part-of: npd-monitoring
spec:
  namespaceSelector:
    matchNames: [kafka]
  selector:
    matchLabels:
      strimzi.io/name: npd-kafka-kafka-exporter
  podMetricsEndpoints:
    - port: tcp-prometheus
      path: /metrics
      interval: 15s
      honorLabels: true
---
# Optional: Service để ServiceMonitor cũng scrape được (nếu muốn)
apiVersion: v1
kind: Service
metadata:
  name: npd-kafka-kafka-exporter
  namespace: kafka
  labels:
    app.kubernetes.io/name: kafka-exporter
    strimzi.io/name: npd-kafka-kafka-exporter
    app.kubernetes.io/part-of: npd-monitoring
spec:
  selector:
    strimzi.io/name: npd-kafka-kafka-exporter
  ports:
    - name: tcp-prometheus
      port: 9404
      targetPort: tcp-prometheus
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kafka-exporter
  namespace: kafka
  labels:
    app.kubernetes.io/part-of: npd-monitoring
spec:
  namespaceSelector:
    matchNames: [kafka]
  selector:
    matchLabels:
      strimzi.io/name: npd-kafka-kafka-exporter
  endpoints:
    - port: tcp-prometheus
      path: /metrics
      interval: 15s
      honorLabels: true
---
# Broker JMX (tuỳ cluster có expose port metrics)
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kafka-brokers
  namespace: kafka
  labels:
    app.kubernetes.io/part-of: npd-monitoring
spec:
  namespaceSelector:
    matchNames: [kafka]
  selector:
    matchLabels:
      strimzi.io/kind: Kafka
      strimzi.io/name: npd-kafka-kafka
  podMetricsEndpoints:
    - targetPort: 9404
      path: /metrics
      interval: 30s
    - targetPort: 9999
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rabbitmq-metrics
  namespace: rabbit
  labels:
    app.kubernetes.io/part-of: npd-monitoring
spec:
  namespaceSelector:
    matchNames: [rabbit]
  selector:
    matchLabels:
      app: rabbitmq
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      honorLabels: true
