# Bật User Workload Monitoring — scrape ServiceMonitor/PrometheusRule user ns
# Apply vào openshift-monitoring (cần cluster-admin).
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-workload-monitoring-config
  namespace: openshift-user-workload-monitoring
  labels:
    app.kubernetes.io/part-of: npd-monitoring
data:
  config.yaml: |
    prometheus:
      retention: 7d
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 2Gi
---
# cluster-monitoring-config — merge enableUserWorkload (nếu CM đã có, merge tay / Argo SSA)
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-monitoring-config
  namespace: openshift-monitoring
  labels:
    app.kubernetes.io/part-of: npd-monitoring
    app.kubernetes.io/component: user-workload
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
data:
  config.yaml: |
    enableUserWorkload: true
    alertmanagerMain:
      enableUserAlertmanagerConfig: true
