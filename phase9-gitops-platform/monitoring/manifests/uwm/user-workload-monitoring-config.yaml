# Bật User Workload Monitoring — scrape ServiceMonitor/PrometheusRule user ns.
#
# QUAN TRỌNG trên cluster NPD:
# ConfigMap cluster-monitoring-config thuộc Argo app **aiops-alertmanager-platform**
# (repo Open-Source-AIOps-Platform). Đừng apply đè file này từ banking-demo — Argo sẽ
# revert. Sửa Git AIOps (đã có enableUserWorkload: true) rồi sync Argo, HOẶC patch tạm:
#
#   oc -n openshift-monitoring edit cm cluster-monitoring-config
#   → thêm: enableUserWorkload: true  (cùng cấp với alertmanagerMain)
#
# File này chỉ còn CM tinh chỉnh UWM (ns openshift-user-workload-monitoring).
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-workload-monitoring-config
  namespace: openshift-user-workload-monitoring
  labels:
    app.kubernetes.io/part-of: npd-monitoring
data:
  config.yaml: |
    prometheus:
      retention: 7d
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 2Gi
