# Tầng 3: Platform / kube (kube-state-metrics — chỉ có trên platform Prometheus)
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: npd-banking-kube-alerts
  namespace: openshift-monitoring
  labels:
    app.kubernetes.io/part-of: npd-monitoring
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    - name: banking.kube
      rules:
        - alert: BankingApiScaledToZero
          expr: |
            kube_deployment_spec_replicas{namespace="npd-banking", deployment="api-producer"} == 0
          for: 1m
          labels:
            severity: critical
            team: banking
            tier: infra
            namespace: npd-banking
          annotations:
            summary: "api-producer replicas=0 — API bị tắt (infra)"
            description: >-
              Deployment scale 0. Nguyên nhân gốc thường là GitOps/Helm replicas hoặc oc scale.
              Hậu quả nghiệp vụ = không chuyển tiền được (xem thêm BankingApiDown trên UWM).

        - alert: BankingDeploymentUnavailable
          expr: |
            kube_deployment_status_replicas_unavailable{namespace="npd-banking"} > 0
          for: 3m
          labels:
            severity: warning
            team: banking
            tier: infra
            namespace: npd-banking
          annotations:
            summary: "Banking deployment có pod unavailable"
            description: "{{ $labels.deployment }} unavailable >0 trong 3m."
