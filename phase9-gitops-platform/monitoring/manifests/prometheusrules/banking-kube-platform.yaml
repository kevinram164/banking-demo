# Gốc hạ tầng — MẶC ĐỊNH TẮT gửi Tele (lab dễ ầm ĩ).
# Triệu chứng chính = 503/5xx trong banking.yaml (consumer unavailable).
#
# Bật lại khi cần: bỏ annotation / đổi labels, hoặc oc apply file này.
# Hiện: không tạo rule replicas=0 để tránh nhầm với “service lỗi”.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: npd-banking-kube-alerts
  namespace: openshift-monitoring
  labels:
    app.kubernetes.io/part-of: npd-monitoring
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    - name: banking.kube.hint
      rules:
        # Giữ rule “pod crash khi desired>0” — không phải scale cố ý về 0
        - alert: BankingDeploymentUnavailable
          expr: |
            kube_deployment_status_replicas_unavailable{namespace="npd-banking"} > 0
            and
            kube_deployment_spec_replicas{namespace="npd-banking"} > 0
          for: 5m
          labels:
            severity: warning
            team: banking
            tier: infra
            namespace: npd-banking
          annotations:
            summary: "Pod banking unavailable (crash/probe) — {{ $labels.deployment }}"
            description: "desired>0 nhưng unavailable>0 trong 5m (sự cố thật, không phải scale=0)."
