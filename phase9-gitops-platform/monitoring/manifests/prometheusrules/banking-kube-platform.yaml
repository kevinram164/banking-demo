# Tầng 3 — kube replicas=0 (chắc khi scale deploy về 0)
# Deploy names = fullnameOverride trong Helm charts.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: npd-banking-kube-alerts
  namespace: openshift-monitoring
  labels:
    app.kubernetes.io/part-of: npd-monitoring
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    - name: banking.kube.scaled
      rules:
        - alert: BankingApiScaledToZero
          expr: |
            kube_deployment_spec_replicas{namespace="npd-banking", deployment="api-producer"} == 0
          for: 1m
          labels:
            severity: critical
            team: banking
            tier: infra
            impact: all-api
            namespace: npd-banking
          annotations:
            summary: "api-producer replicas=0 — mọi API banking tắt"
            description: "Scale 0. Ảnh hưởng: login, số dư, CK, notify qua /api."

        - alert: BankingAuthScaledToZero
          expr: |
            kube_deployment_spec_replicas{namespace="npd-banking", deployment="auth-service"} == 0
          for: 1m
          labels:
            severity: critical
            team: banking
            tier: infra
            impact: login
            namespace: npd-banking
          annotations:
            summary: "auth-service replicas=0 — không login/register"
            description: "Consumer auth tắt."

        - alert: BankingAccountScaledToZero
          expr: |
            kube_deployment_spec_replicas{namespace="npd-banking", deployment="account-service"} == 0
          for: 1m
          labels:
            severity: warning
            team: banking
            tier: infra
            impact: balance
            namespace: npd-banking
          annotations:
            summary: "account-service replicas=0 — không số dư/lookup"
            description: "me/balance/lookup/admin hỏng."

        - alert: BankingTransferScaledToZero
          expr: |
            kube_deployment_spec_replicas{namespace="npd-banking", deployment="transfer-service"} == 0
          for: 1m
          labels:
            severity: critical
            team: banking
            tier: infra
            impact: transfer
            namespace: npd-banking
          annotations:
            summary: "transfer-service replicas=0 — không CK / shop pay"
            description: "P2P + NOLI confirm hỏng."

        - alert: BankingNotificationScaledToZero
          expr: |
            kube_deployment_spec_replicas{namespace="npd-banking", deployment="notification-service"} == 0
          for: 1m
          labels:
            severity: warning
            team: banking
            tier: infra
            impact: notifications
            namespace: npd-banking
          annotations:
            summary: "notification-service replicas=0 — mất WS/notify"
            description: "Realtime + lịch sử thông báo."

        - alert: BankingShopBridgeScaledToZero
          expr: |
            kube_deployment_spec_replicas{namespace="npd-banking", deployment="shop-bridge"} == 0
          for: 1m
          labels:
            severity: critical
            team: banking
            tier: infra
            impact: shop-payment
            namespace: npd-banking
          annotations:
            summary: "shop-bridge replicas=0 — shop không thanh toán xong"
            description: "orders.events / confirm-payment / payments.events dừng."

        - alert: BankingDeploymentUnavailable
          expr: |
            kube_deployment_status_replicas_unavailable{namespace="npd-banking"} > 0
          for: 3m
          labels:
            severity: warning
            team: banking
            tier: infra
            namespace: npd-banking
          annotations:
            summary: "Banking deployment có pod unavailable"
            description: "{{ $labels.deployment }} unavailable >0 trong 3m (crash/probe)."
