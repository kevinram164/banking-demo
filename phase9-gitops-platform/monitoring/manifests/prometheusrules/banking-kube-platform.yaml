# Gốc hạ tầng (tuỳ chọn) — KHÔNG phải tín hiệu chính cho “service lỗi”.
# Triệu chứng chính = 504/5xx trên api-producer (banking.yaml → Telegram).
# Rule này chỉ gợi ý khi ai đó scale replicas=0 (lab) hoặc deploy bị tắt.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: npd-banking-kube-alerts
  namespace: openshift-monitoring
  labels:
    app.kubernetes.io/part-of: npd-monitoring
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    - name: banking.kube.hint
      rules:
        - alert: BankingTransferReplicasZero
          expr: |
            kube_deployment_spec_replicas{namespace="npd-banking", deployment="transfer-service"} == 0
          for: 2m
          labels:
            severity: warning
            team: banking
            tier: root-cause-hint
            impact: transfer
            namespace: npd-banking
          annotations:
            summary: "[Gốc] transfer-service replicas=0 (lab/scale)"
            description: >-
              Gợi ý nguyên nhân. Cảnh báo nghiệp vụ chính: BankingTransferGatewayTimeout / BankingTransfer5xx
              sau khi có request CK.

        - alert: BankingAuthReplicasZero
          expr: |
            kube_deployment_spec_replicas{namespace="npd-banking", deployment="auth-service"} == 0
          for: 2m
          labels:
            severity: warning
            team: banking
            tier: root-cause-hint
            impact: login
            namespace: npd-banking
          annotations:
            summary: "[Gốc] auth-service replicas=0"
            description: "Triệu chứng chính: BankingAuthGatewayTimeout / BankingAuth5xx."

        - alert: BankingAccountReplicasZero
          expr: |
            kube_deployment_spec_replicas{namespace="npd-banking", deployment="account-service"} == 0
          for: 2m
          labels:
            severity: warning
            team: banking
            tier: root-cause-hint
            impact: balance
            namespace: npd-banking
          annotations:
            summary: "[Gốc] account-service replicas=0"
            description: "Triệu chứng chính: BankingAccountGatewayTimeout / BankingAccount5xx."

        - alert: BankingApiReplicasZero
          expr: |
            kube_deployment_spec_replicas{namespace="npd-banking", deployment="api-producer"} == 0
          for: 2m
          labels:
            severity: warning
            team: banking
            tier: root-cause-hint
            impact: all-api
            namespace: npd-banking
          annotations:
            summary: "[Gốc] api-producer replicas=0 — không còn cổng /api"
            description: "Không có HTTP metric; Kong fail. Không có 504 từ producer."
