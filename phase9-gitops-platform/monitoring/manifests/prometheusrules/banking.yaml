# Alert theo TRIỆU CHỨNG sự cố service (không phải “replicas=0”).
# Scale=0 chỉ là cách GIẢ LẬP consumer chết.
#
# Khi transfer-service không chạy + client gọi CK:
#   api-producer → TimeoutError → log producer_timeout → HTTP 504
#   (xem producer/main.py). Metric: http_requests_total{status="504",endpoint=~".*transfer.*"}
#
# Telegram nhận alert từ metric 5xx/504 đó (= cùng sự kiện với log).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: npd-banking-alerts
  namespace: npd-banking
  labels:
    app.kubernetes.io/part-of: npd-monitoring
    role: alert-rules
spec:
  groups:
    - name: banking.symptoms
      rules:
        # --- Transfer không hoạt động (timeout consumer) ---
        - alert: BankingTransferGatewayTimeout
          expr: |
            sum(rate(http_requests_total{
              namespace="npd-banking",
              job="banking-api-producer",
              endpoint=~".*transfer.*",
              status="504"
            }[5m])) > 0.01
          for: 1m
          labels:
            severity: critical
            team: banking
            tier: symptom
            impact: transfer
            namespace: npd-banking
          annotations:
            summary: "Transfer không hoạt động — API trả 504 Gateway timeout"
            description: >-
              api-producer timeout chờ transfer-service (log: producer_timeout, path /api/transfer/*).
              Giả lập: scale transfer=0 rồi gọi CK. OpenSearch: event=producer_timeout.

        - alert: BankingTransfer5xx
          expr: |
            sum(rate(http_requests_total{
              namespace="npd-banking",
              job="banking-api-producer",
              endpoint=~".*transfer.*",
              status=~"5.."
            }[5m])) > 0.02
          for: 1m
          labels:
            severity: critical
            team: banking
            tier: symptom
            impact: transfer
            namespace: npd-banking
          annotations:
            summary: "Chuyển tiền lỗi 5xx (502/504/500)"
            description: >-
              /api/transfer/* trả 5xx. Thường transfer-service down/lỗi hoặc RabbitMQ/Redis.
              Log api-producer: producer_timeout | producer_error.

        - alert: BankingTransferFailRate
          expr: |
            (
              sum(rate(http_requests_total{
                namespace="npd-banking",
                job="banking-api-producer",
                endpoint=~".*transfer.*",
                status=~"[45].."
              }[5m]))
              /
              clamp_min(
                sum(rate(http_requests_total{
                  namespace="npd-banking",
                  job="banking-api-producer",
                  endpoint=~".*transfer.*"
                }[5m])),
                0.01
              )
            ) > 0.5
            and
            sum(rate(http_requests_total{
              namespace="npd-banking",
              job="banking-api-producer",
              endpoint=~".*transfer.*"
            }[5m])) > 0.02
          for: 2m
          labels:
            severity: warning
            team: banking
            tier: symptom
            impact: transfer
            namespace: npd-banking
          annotations:
            summary: "Tỷ lệ CK thất bại >50%"
            description: "Nửa request transfer là 4xx/5xx (có traffic)."

        # --- Auth không hoạt động ---
        - alert: BankingAuthGatewayTimeout
          expr: |
            sum(rate(http_requests_total{
              namespace="npd-banking",
              job="banking-api-producer",
              endpoint=~".*auth.*",
              status="504"
            }[5m])) > 0.01
          for: 1m
          labels:
            severity: critical
            team: banking
            tier: symptom
            impact: login
            namespace: npd-banking
          annotations:
            summary: "Auth không hoạt động — login trả 504"
            description: "Timeout chờ auth-service. Log: producer_timeout path /api/auth/*."

        - alert: BankingAuth5xx
          expr: |
            sum(rate(http_requests_total{
              namespace="npd-banking",
              job="banking-api-producer",
              endpoint=~".*auth.*",
              status=~"5.."
            }[5m])) > 0.02
          for: 1m
          labels:
            severity: critical
            team: banking
            tier: symptom
            impact: login
            namespace: npd-banking
          annotations:
            summary: "Login/register lỗi 5xx"
            description: "/api/auth/* 5xx — auth-service hoặc infra."

        # --- Account không hoạt động ---
        - alert: BankingAccountGatewayTimeout
          expr: |
            sum(rate(http_requests_total{
              namespace="npd-banking",
              job="banking-api-producer",
              endpoint=~".*account.*",
              status="504"
            }[5m])) > 0.01
          for: 1m
          labels:
            severity: critical
            team: banking
            tier: symptom
            impact: balance
            namespace: npd-banking
          annotations:
            summary: "Account không hoạt động — số dư/lookup trả 504"
            description: "Timeout chờ account-service. Log: producer_timeout path /api/account/*."

        - alert: BankingAccount5xx
          expr: |
            sum(rate(http_requests_total{
              namespace="npd-banking",
              job="banking-api-producer",
              endpoint=~".*account.*",
              status=~"5.."
            }[5m])) > 0.02
          for: 1m
          labels:
            severity: critical
            team: banking
            tier: symptom
            impact: balance
            namespace: npd-banking
          annotations:
            summary: "Account API lỗi 5xx"
            description: "/api/account/* 5xx."
