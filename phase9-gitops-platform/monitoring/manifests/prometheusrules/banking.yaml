# Rules theo blast-radius — xem SERVICE-IMPACT.md
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: npd-banking-alerts
  namespace: npd-banking
  labels:
    app.kubernetes.io/part-of: npd-monitoring
    role: alert-rules
spec:
  groups:
    # ── Tầng 1: Nghiệp vụ (API sống + có traffic) ──────────────────────
    - name: banking.business
      rules:
        - alert: BankingTransferHighFailureRate
          expr: |
            (
              sum(rate(http_requests_total{
                namespace="npd-banking",
                job="banking-api-producer",
                endpoint=~".*transfer.*",
                status=~"[45].."
              }[5m]))
              /
              clamp_min(
                sum(rate(http_requests_total{
                  namespace="npd-banking",
                  job="banking-api-producer",
                  endpoint=~".*transfer.*"
                }[5m])),
                0.01
              )
            ) > 0.2
            and
            sum(rate(http_requests_total{
              namespace="npd-banking",
              job="banking-api-producer",
              endpoint=~".*transfer.*"
            }[5m])) > 0.05
          for: 2m
          labels:
            severity: critical
            team: banking
            tier: business
            impact: transfer
            namespace: npd-banking
          annotations:
            summary: "Chuyển tiền thất bại cao (>20%)"
            description: "Path /api/transfer/* 4xx/5xx cao trên api-producer. Ảnh hưởng: P2P + shop CK."

        - alert: BankingAuthHighFailureRate
          expr: |
            (
              sum(rate(http_requests_total{
                namespace="npd-banking",
                job="banking-api-producer",
                endpoint=~".*auth.*",
                status=~"[45].."
              }[5m]))
              /
              clamp_min(
                sum(rate(http_requests_total{
                  namespace="npd-banking",
                  job="banking-api-producer",
                  endpoint=~".*auth.*"
                }[5m])),
                0.01
              )
            ) > 0.3
            and
            sum(rate(http_requests_total{
              namespace="npd-banking",
              job="banking-api-producer",
              endpoint=~".*auth.*"
            }[5m])) > 0.05
          for: 3m
          labels:
            severity: warning
            team: banking
            tier: business
            impact: login
            namespace: npd-banking
          annotations:
            summary: "Login/register lỗi cao"
            description: "Path /api/auth/* fail rate >30%. Ảnh hưởng: không đăng nhập được."

        - alert: BankingHttpHighErrorRate
          expr: |
            sum(rate(http_requests_total{namespace="npd-banking",status=~"5.."}[5m]))
              /
            clamp_min(sum(rate(http_requests_total{namespace="npd-banking"}[5m])), 0.01)
              > 0.1
            and
            sum(rate(http_requests_total{namespace="npd-banking"}[5m])) > 0.05
          for: 5m
          labels:
            severity: warning
            team: banking
            tier: business
            namespace: npd-banking
          annotations:
            summary: "Banking HTTP 5xx > 10%"
            description: "Toàn ns error rate cao (label status)."

    # ── Tầng 2: Scrape up==0 (có target đang down) ─────────────────────
    - name: banking.availability
      rules:
        # Chỉ up==0 (đang scrape nhưng fail). Scale 0 → dùng BankingApiScaledToZero (kube).
        # Không dùng absent() — dễ fire ảo khi target tạm mất khỏi TSDB.
        - alert: BankingApiDown
          expr: |
            up{namespace="npd-banking", job="banking-api-producer"} == 0
          for: 2m
          labels:
            severity: critical
            team: banking
            tier: availability
            impact: all-api
            namespace: npd-banking
          annotations:
            summary: "api-producer scrape DOWN — mọi API banking qua Kong fail"
            description: "up=0 job banking-api-producer. Scale 0 xem BankingApiScaledToZero."

        - alert: BankingAuthDown
          expr: up{namespace="npd-banking", job="banking-auth"} == 0
          for: 2m
          labels:
            severity: critical
            team: banking
            tier: availability
            impact: login
            namespace: npd-banking
          annotations:
            summary: "auth-service DOWN — không đăng ký/đăng nhập"
            description: "Consumer auth.requests. Session mới không tạo được."

        - alert: BankingAccountDown
          expr: up{namespace="npd-banking", job="banking-account"} == 0
          for: 2m
          labels:
            severity: warning
            team: banking
            tier: availability
            impact: balance
            namespace: npd-banking
          annotations:
            summary: "account-service DOWN — không xem số dư/lookup STK"
            description: "me/balance/lookup/admin credit fail. Login + CK (đã biết STK) có thể còn."

        - alert: BankingTransferDown
          expr: up{namespace="npd-banking", job="banking-transfer"} == 0
          for: 2m
          labels:
            severity: critical
            team: banking
            tier: availability
            impact: transfer
            namespace: npd-banking
          annotations:
            summary: "transfer-service DOWN — không chuyển tiền / shop CK"
            description: "P2P + confirm merchant NOLI hỏng. Login/số dư vẫn OK."

        - alert: BankingNotificationDown
          expr: up{namespace="npd-banking", job="banking-notification"} == 0
          for: 3m
          labels:
            severity: warning
            team: banking
            tier: availability
            impact: notifications
            namespace: npd-banking
          annotations:
            summary: "notification-service DOWN — mất realtime/lịch sử notify"
            description: "WS /ws + list notifications. CK vẫn thành công."

        - alert: BankingShopBridgeDown
          expr: up{namespace="npd-banking", job="banking-shop-bridge"} == 0
          for: 2m
          labels:
            severity: critical
            team: banking
            tier: availability
            impact: shop-payment
            namespace: npd-banking
          annotations:
            summary: "shop-bridge DOWN — shop không confirm thanh toán"
            description: "Kafka orders→payments + /api/shop/confirm-payment. Banking P2P thuần vẫn OK."
