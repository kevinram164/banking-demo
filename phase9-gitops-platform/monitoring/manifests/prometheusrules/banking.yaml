apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: npd-banking-alerts
  namespace: npd-banking
  labels:
    app.kubernetes.io/part-of: npd-monitoring
    role: alert-rules
spec:
  groups:
    - name: banking.apps
      rules:
        # UWM chỉ có metric scrape app — KHÔNG có kube_deployment_* (platform).
        # Scale replicas=0 → không còn target up → absent() fire.
        # job thường = tên ServiceMonitor (banking-api-producer).
        - alert: BankingApiProducerDown
          expr: |
            (
              absent(up{namespace="npd-banking", job="banking-api-producer"}) == 1
            )
            or
            (
              up{namespace="npd-banking", job="banking-api-producer"} == 0
            )
          for: 1m
          labels:
            severity: warning
            team: banking
            namespace: npd-banking
          annotations:
            summary: "api-producer scrape down / no targets"
            description: "UWM không thấy up=1 cho job banking-api-producer (pod scale 0 hoặc crash)."

        - alert: BankingServiceDown
          expr: |
            up{namespace="npd-banking", job=~"banking-.*"} == 0
          for: 2m
          labels:
            severity: warning
            team: banking
            namespace: npd-banking
          annotations:
            summary: "Banking scrape target down"
            description: "job={{ $labels.job }} instance={{ $labels.instance }} up=0 for 2m."

        - alert: BankingHighErrorRate
          expr: |
            sum(rate(http_requests_total{namespace="npd-banking",code=~"5.."}[5m]))
              /
            clamp_min(sum(rate(http_requests_total{namespace="npd-banking"}[5m])), 1)
              > 0.1
          for: 5m
          labels:
            severity: warning
            team: banking
            namespace: npd-banking
          annotations:
            summary: "Banking HTTP 5xx > 10%"
            description: "Error rate high in npd-banking for 5m."
