# Triệu chứng: 503/504 từ api-producer (consumer down).
# Dùng rate()>0 — ổn định hơn increase() khi series mới xuất hiện.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: npd-banking-alerts
  namespace: npd-banking
  labels:
    app.kubernetes.io/part-of: npd-monitoring
    role: alert-rules
spec:
  groups:
    - name: banking.symptoms
      rules:
        - alert: BankingTransferUnavailable
          expr: |
            sum(
              rate(
                http_requests_total{
                  namespace="npd-banking",
                  status=~"503|504"
                }[5m]
              )
            ) > 0
          for: 0m
          labels:
            severity: critical
            team: banking
            tier: symptom
            impact: transfer
            namespace: npd-banking
          annotations:
            summary: "Transfer/downstream không hoạt động — API trả 503/504"
            description: >-
              Có HTTP 503/504 trên ns npd-banking (thường api-producer timeout chờ transfer).
              Log: producer_timeout / downstream_unavailable.

        - alert: BankingProducer5xx
          expr: |
            sum(
              rate(
                http_requests_total{
                  namespace="npd-banking",
                  job="banking-api-producer",
                  status=~"5.."
                }[5m]
              )
            ) > 0
          for: 0m
          labels:
            severity: critical
            team: banking
            tier: symptom
            impact: transfer
            namespace: npd-banking
          annotations:
            summary: "api-producer đang trả 5xx"
            description: "rate 5xx > 0 trên job banking-api-producer."
