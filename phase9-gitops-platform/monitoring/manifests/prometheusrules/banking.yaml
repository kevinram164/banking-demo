# NPD Banking — cơ chế cảnh báo (3 tầng)
#
# Khi API down hoàn toàn: KHÔNG có HTTP transfer metric → tầng 1 không fire.
# Tầng 2 (API down) = tín hiệu "giao dịch không thực hiện được".
# Khi API còn sống nhưng transfer 4xx/5xx cao → tầng 1 fire trước / song song.
#
# Metric app (UWM): http_requests_total{method,endpoint,status} — KHÔNG có label `code`.
# Label `endpoint` = path (/api/transfer/...) nếu ServiceMonitor honorLabels+labeldrop OK.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: npd-banking-alerts
  namespace: npd-banking
  labels:
    app.kubernetes.io/part-of: npd-monitoring
    role: alert-rules
spec:
  groups:
    # ── Tầng 1: Nghiệp vụ (API còn scrape được, có traffic) ─────────────
    - name: banking.business
      rules:
        - alert: BankingTransferHighFailureRate
          expr: |
            (
              sum(rate(http_requests_total{
                namespace="npd-banking",
                job="banking-api-producer",
                endpoint=~".*transfer.*",
                status=~"[45].."
              }[5m]))
              /
              clamp_min(
                sum(rate(http_requests_total{
                  namespace="npd-banking",
                  job="banking-api-producer",
                  endpoint=~".*transfer.*"
                }[5m])),
                0.01
              )
            ) > 0.2
            and
            sum(rate(http_requests_total{
              namespace="npd-banking",
              job="banking-api-producer",
              endpoint=~".*transfer.*"
            }[5m])) > 0.05
          for: 2m
          labels:
            severity: critical
            team: banking
            tier: business
            namespace: npd-banking
          annotations:
            summary: "Chuyển tiền thất bại cao (>20% 4xx/5xx)"
            description: >-
              Tỷ lệ transfer lỗi trên api-producer >20% trong 5m (có traffic).
              Kiểm tra account/redis/DB hoặc payload shop trước khi nghi API down.

        - alert: BankingTransferErrorsBurst
          expr: |
            sum(rate(http_requests_total{
              namespace="npd-banking",
              job="banking-api-producer",
              endpoint=~".*transfer.*",
              status=~"5.."
            }[5m])) > 0.1
          for: 2m
          labels:
            severity: warning
            team: banking
            tier: business
            namespace: npd-banking
          annotations:
            summary: "Burst lỗi 5xx trên API chuyển tiền"
            description: "Có request transfer trả 5xx — dịch vụ transfer/backend lỗi."

        - alert: BankingHttpHighErrorRate
          expr: |
            sum(rate(http_requests_total{namespace="npd-banking",status=~"5.."}[5m]))
              /
            clamp_min(sum(rate(http_requests_total{namespace="npd-banking"}[5m])), 0.01)
              > 0.1
            and
            sum(rate(http_requests_total{namespace="npd-banking"}[5m])) > 0.05
          for: 5m
          labels:
            severity: warning
            team: banking
            tier: business
            namespace: npd-banking
          annotations:
            summary: "Banking HTTP 5xx > 10%"
            description: "Toàn ns npd-banking error rate cao (label status, không phải code)."

    # ── Tầng 2: API / dịch vụ không hoạt động (= giao dịch không làm được) ─
    - name: banking.availability
      rules:
        - alert: BankingApiDown
          expr: |
            (
              absent(up{namespace="npd-banking", job="banking-api-producer"}) == 1
            )
            or
            (
              up{namespace="npd-banking", job="banking-api-producer"} == 0
            )
          for: 1m
          labels:
            severity: critical
            team: banking
            tier: availability
            namespace: npd-banking
          annotations:
            summary: "API banking không hoạt động — giao dịch không thực hiện được"
            description: >-
              api-producer scrape down / không còn target (job=banking-api-producer).
              Kong → /api/* fail. Đây là cảnh báo availability khi không còn HTTP metric transfer.

        - alert: BankingAuthDown
          expr: |
            (
              absent(up{namespace="npd-banking", job="banking-auth"}) == 1
            )
            or
            (
              up{namespace="npd-banking", job="banking-auth"} == 0
            )
          for: 2m
          labels:
            severity: critical
            team: banking
            tier: availability
            namespace: npd-banking
          annotations:
            summary: "Auth service down — login/token fail"
            description: "job banking-auth up!=1."

        - alert: BankingAccountDown
          expr: |
            (
              absent(up{namespace="npd-banking", job="banking-account"}) == 1
            )
            or
            (
              up{namespace="npd-banking", job="banking-account"} == 0
            )
          for: 2m
          labels:
            severity: critical
            team: banking
            tier: availability
            namespace: npd-banking
          annotations:
            summary: "Account service down — số dư/CK phụ thuộc account"
            description: "job banking-account up!=1."

        - alert: BankingTransferServiceDown
          expr: |
            (
              absent(up{namespace="npd-banking", job="banking-transfer"}) == 1
            )
            or
            (
              up{namespace="npd-banking", job="banking-transfer"} == 0
            )
          for: 2m
          labels:
            severity: critical
            team: banking
            tier: availability
            namespace: npd-banking
          annotations:
            summary: "Transfer consumer down — queue CK không xử lý"
            description: "job banking-transfer up!=1 (consumer RabbitMQ)."
