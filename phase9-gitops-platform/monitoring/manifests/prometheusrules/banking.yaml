# Alert theo TRIỆU CHỨNG: consumer không hoạt động → api-producer trả 503.
# (Timeout chờ Rabbit/Redis reply; không còn dùng 504.)
# Log: downstream_unavailable | producer_error
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: npd-banking-alerts
  namespace: npd-banking
  labels:
    app.kubernetes.io/part-of: npd-monitoring
    role: alert-rules
spec:
  groups:
    - name: banking.symptoms
      rules:
        - alert: BankingTransferUnavailable
          expr: |
            sum(increase(http_requests_total{
              namespace="npd-banking",
              job="banking-api-producer",
              endpoint=~".*transfer.*",
              status=~"503|504"
            }[5m])) >= 1
          for: 0m
          labels:
            severity: critical
            team: banking
            tier: symptom
            impact: transfer
            namespace: npd-banking
          annotations:
            summary: "Transfer không hoạt động — API trả 503 Service Unavailable"
            description: >-
              api-producer không nhận reply từ transfer-service (log: downstream_unavailable).
              Giả lập: scale transfer=0 rồi gọi CK. status 504 chỉ còn nếu image cũ chưa rebuild.

        - alert: BankingTransfer5xx
          expr: |
            sum(increase(http_requests_total{
              namespace="npd-banking",
              job="banking-api-producer",
              endpoint=~".*transfer.*",
              status=~"5.."
            }[5m])) >= 2
          for: 0m
          labels:
            severity: critical
            team: banking
            tier: symptom
            impact: transfer
            namespace: npd-banking
          annotations:
            summary: "Chuyển tiền lỗi 5xx (503/502/500)"
            description: "/api/transfer/* 5xx — transfer-service down hoặc infra."

        - alert: BankingTransferFailRate
          expr: |
            (
              sum(rate(http_requests_total{
                namespace="npd-banking",
                job="banking-api-producer",
                endpoint=~".*transfer.*",
                status=~"[45].."
              }[5m]))
              /
              clamp_min(
                sum(rate(http_requests_total{
                  namespace="npd-banking",
                  job="banking-api-producer",
                  endpoint=~".*transfer.*"
                }[5m])),
                0.01
              )
            ) > 0.5
            and
            sum(rate(http_requests_total{
              namespace="npd-banking",
              job="banking-api-producer",
              endpoint=~".*transfer.*"
            }[5m])) > 0.02
          for: 2m
          labels:
            severity: warning
            team: banking
            tier: symptom
            impact: transfer
            namespace: npd-banking
          annotations:
            summary: "Tỷ lệ CK thất bại >50%"
            description: "Nửa request transfer là 4xx/5xx (có traffic)."

        - alert: BankingAuthUnavailable
          expr: |
            sum(increase(http_requests_total{
              namespace="npd-banking",
              job="banking-api-producer",
              endpoint=~".*auth.*",
              status=~"503|504"
            }[5m])) >= 1
          for: 0m
          labels:
            severity: critical
            team: banking
            tier: symptom
            impact: login
            namespace: npd-banking
          annotations:
            summary: "Auth không hoạt động — login trả 503"
            description: "Không có reply từ auth-service. Log: downstream_unavailable."

        - alert: BankingAuth5xx
          expr: |
            sum(increase(http_requests_total{
              namespace="npd-banking",
              job="banking-api-producer",
              endpoint=~".*auth.*",
              status=~"5.."
            }[5m])) >= 2
          for: 0m
          labels:
            severity: critical
            team: banking
            tier: symptom
            impact: login
            namespace: npd-banking
          annotations:
            summary: "Login/register lỗi 5xx"
            description: "/api/auth/* 5xx."

        - alert: BankingAccountUnavailable
          expr: |
            sum(increase(http_requests_total{
              namespace="npd-banking",
              job="banking-api-producer",
              endpoint=~".*account.*",
              status=~"503|504"
            }[5m])) >= 1
          for: 0m
          labels:
            severity: critical
            team: banking
            tier: symptom
            impact: balance
            namespace: npd-banking
          annotations:
            summary: "Account không hoạt động — API trả 503"
            description: "Không có reply từ account-service. Log: downstream_unavailable."

        - alert: BankingAccount5xx
          expr: |
            sum(increase(http_requests_total{
              namespace="npd-banking",
              job="banking-api-producer",
              endpoint=~".*account.*",
              status=~"5.."
            }[5m])) >= 2
          for: 0m
          labels:
            severity: critical
            team: banking
            tier: symptom
            impact: balance
            namespace: npd-banking
          annotations:
            summary: "Account API lỗi 5xx"
            description: "/api/account/* 5xx."
