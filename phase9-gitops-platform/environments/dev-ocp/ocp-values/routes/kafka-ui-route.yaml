# Kafka UI (Kafbat) — OpenShift Route
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: kafka-ui-platform
  namespace: kafka
  labels:
    app.kubernetes.io/name: kafka-ui
    app.kubernetes.io/part-of: phase9-gitops
    npd/shared-platform: "true"
    banking-demo/environment: dev-ocp
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  host: kafka-ui-platform.apps.ocp01.npd.co
  to:
    kind: Service
    name: kafka-ui
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
