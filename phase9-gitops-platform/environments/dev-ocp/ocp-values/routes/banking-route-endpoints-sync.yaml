# SA/RBAC: resource thường (sync-wave 1) — KHÔNG dùng PreSync.
# Job PostSync: sau khi Service/Route sync xong → ghi Endpoints = IP pod Kong.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: banking-route-sync
  namespace: npd-banking
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: banking-route-sync-npd
  namespace: npd-banking
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups: [""]
    resources: ["endpoints", "services"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: banking-route-sync-npd
  namespace: npd-banking
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: banking-route-sync-npd
subjects:
  - kind: ServiceAccount
    name: banking-route-sync
    namespace: npd-banking
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: banking-route-sync-kong
  namespace: kong
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups: [""]
    resources: ["endpoints", "services"]
    verbs: ["get", "list"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: banking-route-sync-kong
  namespace: kong
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: banking-route-sync-kong
subjects:
  - kind: ServiceAccount
    name: banking-route-sync
    namespace: npd-banking
---
apiVersion: batch/v1
kind: Job
metadata:
  name: banking-routes-sync-endpoints
  namespace: npd-banking
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "10"
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: banking-route-sync
      restartPolicy: OnFailure
      containers:
        - name: sync
          image: quay.io/openshift/origin-cli:4.16
          command:
            - /bin/sh
            - -c
            - |
              set -e
              # Dọn Route lệch thiết kế (nếu còn ở ns kong)
              oc delete route npd-banking-api npd-banking-ws -n kong --ignore-not-found
              # IP pod Kong → Endpoints kong-proxy-ext (ns app)
              IPS=$(oc get endpoints kong-kong-proxy -n kong -o jsonpath='{range .subsets[*].addresses[*]}{"      - ip: "}{.ip}{"\n"}{end}')
              echo "Kong pod IPs:"
              echo "$IPS"
              oc apply -f - <<EOF
              apiVersion: v1
              kind: Endpoints
              metadata:
                name: kong-proxy-ext
                namespace: npd-banking
              subsets:
              - addresses:
              ${IPS}
                ports:
                - name: http
                  port: 8000
                  protocol: TCP
              EOF
              echo "Endpoints kong-proxy-ext synced"
