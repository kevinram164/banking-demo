# Thiết kế gốc: Route /api,/ws → Service kong-proxy-ext trong ns app.
# Bridge TCP (socat) → Kong DNS. Tắt Linkerd inject (Kong không mesh → mTLS gây 503).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong-proxy-bridge
  namespace: npd-banking
  labels:
    app.kubernetes.io/name: banking-demo
    app.kubernetes.io/component: kong-proxy
    banking-demo/environment: dev-ocp
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kong-proxy-bridge
  template:
    metadata:
      labels:
        app: kong-proxy-bridge
      annotations:
        linkerd.io/inject: disabled
    spec:
      containers:
        - name: proxy
          image: alpine/socat:1.8.0.0
          args:
            - TCP-LISTEN:8080,fork,reuseaddr
            - TCP:kong-kong-proxy.kong.svc.cluster.local:8000
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: kong-proxy-ext
  namespace: npd-banking
  labels:
    app.kubernetes.io/name: banking-demo
    app.kubernetes.io/component: kong-proxy
    banking-demo/environment: dev-ocp
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app: kong-proxy-bridge
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
