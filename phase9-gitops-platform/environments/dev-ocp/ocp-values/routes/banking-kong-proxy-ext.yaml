# ExternalName — chỉ dùng cho traffic trong-cluster (pod → Kong).
# OpenShift Route KHÔNG dùng được Service ExternalName (không có Endpoints) → 503.
# Route /api,/ws: xem banking-route-api.yaml / banking-route-ws.yaml (ns kong).
apiVersion: v1
kind: Service
metadata:
  name: kong-proxy-ext
  namespace: npd-banking
  labels:
    app.kubernetes.io/name: banking-demo
    app.kubernetes.io/component: kong-proxy
    banking-demo/environment: dev-ocp
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  type: ExternalName
  externalName: kong-kong-proxy.kong.svc.cluster.local
  ports:
    - name: http
      port: 8000
      protocol: TCP
