# Thiết kế gốc: Service trong ns app cho Route /api,/ws.
# OpenShift Route cần Endpoints thật — không dùng type ExternalName (→ 503).
# Endpoints trỏ IP pod Kong (oc get endpoints kong-kong-proxy -n kong).
apiVersion: v1
kind: Service
metadata:
  name: kong-proxy-ext
  namespace: npd-banking
  labels:
    app.kubernetes.io/name: banking-demo
    app.kubernetes.io/component: kong-proxy
    banking-demo/environment: dev-ocp
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
