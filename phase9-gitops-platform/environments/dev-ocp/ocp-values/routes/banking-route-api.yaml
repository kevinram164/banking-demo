# Banking API — npd-banking.co/api → Kong (qua Service trong cùng ns app)
# Thiết kế gốc: Route ở ns app, không ở ns kong.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: npd-banking-api
  namespace: npd-banking
  labels:
    app.kubernetes.io/name: banking-demo
    app.kubernetes.io/component: api
    banking-demo/environment: dev-ocp
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    haproxy.router.openshift.io/timeout: 600s
spec:
  host: npd-banking.co
  path: /api
  to:
    kind: Service
    name: kong-proxy-ext
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
