# Banking API — npd-banking.co/api
# Cùng ns với Route / (npd-banking): OpenShift chỉ admit 1 namespace giữ host.
# Backend: Service kong-proxy-route (+ Endpoints → Kong ClusterIP)
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: npd-banking-api
  namespace: npd-banking
  labels:
    app.kubernetes.io/name: banking-demo
    app.kubernetes.io/component: api
    banking-demo/environment: dev-ocp
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    haproxy.router.openshift.io/timeout: 600s
spec:
  host: npd-banking.co
  path: /api
  to:
    kind: Service
    name: kong-proxy-route
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
