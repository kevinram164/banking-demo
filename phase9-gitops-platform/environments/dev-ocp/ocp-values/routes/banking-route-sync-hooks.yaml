# PreSync: xóa Route /api /ws cũ ở ns kong (host claim) — tránh HostAlreadyClaimed
# PostSync: ghi Endpoints kong-proxy-route = ClusterIP Service kong-kong-proxy
apiVersion: v1
kind: ServiceAccount
metadata:
  name: banking-route-sync
  namespace: npd-banking
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: banking-route-sync-npd
  namespace: npd-banking
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups: [""]
    resources: ["endpoints", "services"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: banking-route-sync-npd
  namespace: npd-banking
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: banking-route-sync-npd
subjects:
  - kind: ServiceAccount
    name: banking-route-sync
    namespace: npd-banking
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: banking-route-sync-kong
  namespace: kong
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: banking-route-sync-kong
  namespace: kong
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: banking-route-sync-kong
subjects:
  - kind: ServiceAccount
    name: banking-route-sync
    namespace: npd-banking
---
apiVersion: batch/v1
kind: Job
metadata:
  name: banking-routes-presync-cleanup
  namespace: npd-banking
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  ttlSecondsAfterFinished: 120
  template:
    spec:
      serviceAccountName: banking-route-sync
      restartPolicy: Never
      containers:
        - name: cleanup
          image: quay.io/openshift/origin-cli:4.16
          command:
            - /bin/sh
            - -c
            - |
              oc delete route npd-banking-api npd-banking-ws -n kong --ignore-not-found
              echo "cleaned kong routes (if any)"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: banking-routes-postsync-endpoints
  namespace: npd-banking
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  ttlSecondsAfterFinished: 120
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: banking-route-sync
      restartPolicy: OnFailure
      containers:
        - name: sync-ep
          image: quay.io/openshift/origin-cli:4.16
          command:
            - /bin/sh
            - -c
            - |
              CIP=$(oc get svc kong-kong-proxy -n kong -o jsonpath='{.spec.clusterIP}')
              echo "Kong ClusterIP=$CIP"
              oc apply -f - <<EOF
              apiVersion: v1
              kind: Endpoints
              metadata:
                name: kong-proxy-route
                namespace: npd-banking
              subsets:
              - addresses:
                - ip: ${CIP}
                ports:
                - name: http
                  port: 8000
                  protocol: TCP
              EOF
              echo "Endpoints kong-proxy-route synced"
