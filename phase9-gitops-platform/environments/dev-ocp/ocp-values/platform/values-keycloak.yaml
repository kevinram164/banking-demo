# Bitnami Keycloak — OpenShift (dev-ocp)
# TLS terminate tại Route (edge); pod HTTP + xforwarded.
# LAB: admin password plaintext — sau chuyển Vault/ESO.
# Image: bitnamilegacy (Docker Hub) — cùng pattern postgres/redis.

fullnameOverride: keycloak
nameOverride: keycloak

global:
  security:
    allowInsecureImages: true
  compatibility:
    openshift:
      adaptSecurityContext: force

image:
  registry: docker.io
  repository: bitnamilegacy/keycloak
  tag: 26.3.3-debian-12-r0

replicaCount: 1

auth:
  adminUser: admin
  adminPassword: "Tech@1604"

production: true
proxyHeaders: xforwarded
httpEnabled: true
hostnameStrict: true

extraEnvVars:
  - name: KC_HOSTNAME
    value: "https://keycloak-platform.apps.ocp01.npd.co"
  - name: KC_HOSTNAME_STRICT
    value: "true"
  - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
    value: "false"
  # bitnamilegacy Keycloak 26.x bug: Incomplete line .../conf/[1,14]
  # https://github.com/bitnami/charts/issues/36298
  - name: KC_CACHE_CONFIG_FILE
    value: cache-ispn.xml

ingress:
  enabled: false

service:
  type: ClusterIP
  ports:
    http: 8080

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1536Mi

postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: 17.6.0-debian-12-r0
  auth:
    username: keycloak
    password: "Tech1604"
    database: keycloak
  primary:
    persistence:
      enabled: true
      size: 8Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

# Lab 1 replica — local cache; KC_CACHE_CONFIG_FILE bắt buộc với bitnamilegacy
cache:
  enabled: false

metrics:
  enabled: false

networkPolicy:
  enabled: false
