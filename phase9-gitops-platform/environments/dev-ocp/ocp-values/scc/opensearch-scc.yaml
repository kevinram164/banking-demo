# OpenSearch + Dashboards — UID 1000 (OCP restricted-v2 không cho)
# Gắn SA logging; permissive hơn kong một chút (RunAsAny) để initContainer chart cũng qua được
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: opensearch-uid1000
  labels:
    banking-demo/environment: dev-ocp
    app.kubernetes.io/part-of: phase9-gitops
    app.kubernetes.io/component: logging
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: false
allowPrivilegedContainer: false
allowedCapabilities: null
defaultAddCapabilities: null
# RunAsAny: chart có initContainer + container đều set 1000; MustRunAs đôi khi miss
runAsUser:
  type: RunAsAny
runAsGroup:
  type: RunAsAny
fsGroup:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
seLinuxContext:
  type: RunAsAny
seccompProfiles:
  - runtime/default
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - persistentVolumeClaim
  - projected
  - secret
users: []
