# OpenSearch + Dashboards — UID 1000
# Bind cả group SA ns logging (tránh sót SA default / opensearch / dashboards)
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: opensearch-uid1000
  labels:
    banking-demo/environment: dev-ocp
    app.kubernetes.io/part-of: phase9-gitops
    app.kubernetes.io/component: logging
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: false
allowPrivilegedContainer: false
allowedCapabilities: null
defaultAddCapabilities: null
runAsUser:
  type: RunAsAny
runAsGroup:
  type: RunAsAny
fsGroup:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
seLinuxContext:
  type: RunAsAny
seccompProfiles:
  - runtime/default
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - persistentVolumeClaim
  - projected
  - secret
# Mọi SA trong ns logging đều dùng được SCC này
groups:
  - system:serviceaccounts:logging
users: []
