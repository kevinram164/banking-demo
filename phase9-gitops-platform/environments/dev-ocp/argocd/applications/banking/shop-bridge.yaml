# Shop↔Banking Kafka bridge — consume orders.events, produce payments.events
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: banking-shop-bridge
  namespace: argocd
  labels:
    app.kubernetes.io/name: banking-demo
    app.kubernetes.io/component: shop-bridge
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: banking-platform
  source:
    repoURL: https://github.com/kevinram164/banking-demo.git
    targetRevision: dev-ocp
    path: phase2-helm-chart/banking-demo
    helm:
      releaseName: banking-shop-bridge
      valueFiles:
        - charts/common/values.yaml
        - charts/shop-bridge/values.yaml
        - values-phase8.yaml
        - ../../phase9-gitops-platform/gitops/values-images.yaml
        - ../../phase9-gitops-platform/gitops/values-observability.yaml
        - ../../phase9-gitops-platform/gitops/values-kafka.yaml
        - ../../phase9-gitops-platform/gitops/values-ecosystem.yaml
      parameters:
        - name: namespace.enabled
          value: "false"
        - name: secret.enabled
          value: "false"
        - name: postgres.enabled
          value: "false"
        - name: redis.enabled
          value: "false"
        - name: kong.enabled
          value: "false"
        - name: auth-service.enabled
          value: "false"
        - name: account-service.enabled
          value: "false"
        - name: transfer-service.enabled
          value: "false"
        - name: api-producer.enabled
          value: "false"
        - name: notification-service.enabled
          value: "false"
        - name: frontend.enabled
          value: "false"
        - name: ingress.enabled
          value: "false"
        - name: shop-bridge.enabled
          value: "true"
  destination:
    server: https://kubernetes.default.svc
    namespace: npd-banking
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
