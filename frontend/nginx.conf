server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Kong ở ns kong — không dùng short name "kong" (không có trong banking).
    # Variable + resolver: resolve lúc request, tránh [emerg] host not found khi start.
    resolver dns-default.openshift-dns.svc.cluster.local kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;

    # SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API -> Kong Gateway (Phase 5)
    location /api/ {
        set $kong_upstream kong-kong-proxy.kong.svc.cluster.local:8000;
        proxy_pass http://$kong_upstream/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket -> Kong Gateway
    location /ws {
        set $kong_upstream kong-kong-proxy.kong.svc.cluster.local:8000;
        proxy_pass http://$kong_upstream/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
